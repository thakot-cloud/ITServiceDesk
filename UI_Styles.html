  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid rgba(250, 119, 55, 0.35);
  overflow: hidden;
  box-sizing: border-box;
}
.brand .logo {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #fa7737 0%, #ffc92e 100%);
  color: #fff;
  flex: 0 0 44px;
  box-shadow: 0 4px 14px rgba(250, 119, 55, 0.35);
}
.brand-copy {
  min-width: 0;
  transition: opacity 0.18s;
}
.brand strong {
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  display: block;
}
.brand small {
  font-size: 14px;
  line-height: 1.25;
  font-weight: 400;
  color: #d5e3f5;
  margin-top: 2px;
  white-space: nowrap;
}
.section-name {
  display: block;
  padding: 18px 20px 8px;
  font-size: 14px;
  line-height: 1.4;
  color: #d5e3f5;
  letter-spacing: 0;
  white-space: nowrap;
  overflow: hidden;
}
.sidebar nav {
  padding: 4px 0 12px;
}
.sidebar nav button {
  height: 46px;
  padding: 0 18px;
  border-radius: 0;
  margin: 0;
  color: #d5e3f5;
  gap: 13px;
  border-left: 4px solid transparent;
  white-space: nowrap;
  overflow: hidden;
  position: relative;
  transform: translateZ(0);
  transform-origin: center;
  will-change: transform;
  transition:
    transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1),
    background 0.18s,
    border-color 0.18s,
    color 0.18s,
    box-shadow 0.2s;
}
.sidebar nav button:hover {
  background: rgba(250, 119, 55, 0.14);
  color: #ffc92e;
}
.sidebar nav button.active {
  background: linear-gradient(90deg, #fa7737, #ea580c);
  border-left-color: #ffc92e;
  color: #fff;
  box-shadow: 0 4px 16px rgba(250, 119, 55, 0.35);
}
.sidebar nav button .ico {
  width: 27.6px;
  min-width: 27.6px;
  font-size: 24.15px;
  margin-left: -1px;
  transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.sidebar nav button .ico + * {
  min-width: 0;
}
.sidebar nav button .sidebar-label {
  display: block;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.sidebar-bottom {
  padding: 14px 16px 16px;
  background: rgba(4, 18, 39, 0.36);
  border-top: 1px solid rgba(255, 255, 255, 0.08);
  overflow: hidden;
}
.profile {
  gap: 10px;
  margin-bottom: 10px;
  padding: 6px;
  border-radius: 10px;
  cursor: pointer;
}
.profile:hover {
  background: rgba(255, 255, 255, 0.06);
}
.profile .avatar {
  flex: 0 0 36px;
}
.profile-copy {
  min-width: 0;
}
.profile strong {
  display: block;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.profile small {
  white-space: nowrap;
}
.sidebar-signout {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 6px;
  color: #b8cbe3;
  white-space: nowrap;
}
.sidebar-collapse {
  position: absolute;
  right: -13px;
  bottom: 24px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1px solid #d7e2ee;
  background: #fff;
  color: #5b6f85;
  display: grid;
  place-items: center;
  padding: 0;
  box-shadow: 0 5px 15px rgba(10, 31, 56, 0.16);
  z-index: 45;
  transition: transform 0.2s;
}
.sidebar-collapse:hover {
  transform: scale(1.08);
}
.sidebar.is-collapsed {
  width: var(--sidebar-collapsed);
  min-width: var(--sidebar-collapsed);
}
.sidebar.is-collapsed .brand {
  height: var(--topbar-height, 68px) !important;
  min-height: var(--topbar-height, 68px) !important;
  max-height: var(--topbar-height, 68px) !important;
  justify-content: center !important;
  align-items: center !important;
  padding: 0 !important;
  border-bottom: 1px solid rgba(250, 119, 55, 0.35) !important;
  box-sizing: border-box !important;
}
.sidebar.is-collapsed .brand-copy,
.sidebar.is-collapsed .profile-copy,
.sidebar.is-collapsed .sidebar-label {
  display: none !important;
}
.sidebar.is-collapsed .section-name {
  display: block !important;
  text-align: center;
  padding: 18px 0 8px;
  font-size: 14px;
  letter-spacing: 0;
}
.sidebar.is-collapsed .sidebar-bottom {
  padding-left: 16px;
  padding-right: 16px;
}
.sidebar.is-collapsed .profile {
  justify-content: center;
}
.sidebar.is-collapsed .sidebar-signout {
  justify-content: center;
  gap: 0;
}
.sidebar.is-collapsed nav button {
  justify-content: center;
  gap: 0;
  padding: 0;
}
.sidebar.is-collapsed nav button .ico {
  margin: 0;
  width: 27.6px;
  min-width: 27.6px;
}
.sidebar.is-collapsed .sidebar-collapse .material-symbols-rounded {
  transform: rotate(180deg);
}

/* Topbar */
.topbar {
  height: var(--topbar-height);
  min-height: var(--topbar-height);
  padding: 0 22px;
  background: #fff;
  border-bottom: 1px solid var(--ui-border);
  gap: 15px;
  position: relative;
  z-index: 30;
}
.palette-toggle {
  flex: 0 0 38px;
}
.mode-toggle {
  flex: 0 0 38px;
}
html[data-palette] .palette-toggle {
  color: var(--theme-accent);
}
html[data-palette] .palette-toggle:hover,
html[data-palette] .palette-toggle:focus-visible {
  color: var(--theme-action);
}
.inventory-survey-switch {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 42px;
  color: var(--theme-text);
  font-weight: 600;
}
.inventory-survey-switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}
.inventory-survey-track {
  position: relative;
  flex: 0 0 46px;
  height: 26px;
  border-radius: 999px;
  background: var(--theme-border);
  cursor: pointer;
  transition: background 0.18s ease;
}
.inventory-survey-track::before {
  position: absolute;
  top: 3px;
  left: 3px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgb(15 23 42 / 24%);
  content: '';
  transition: transform 0.18s ease;
}
.inventory-survey-switch input:checked + .inventory-survey-track {
  background: var(--theme-accent);
}
.inventory-survey-switch input:checked + .inventory-survey-track::before {
  transform: translateX(20px);
}
.inventory-survey-switch input:focus-visible + .inventory-survey-track {
  outline: 3px solid var(--theme-focus);
  outline-offset: 3px;
}
.inventory-survey-switch strong {
  color: var(--theme-accent);
}
.mode-toggle .material-symbols-rounded {
  margin: 0;
}
.crumb {
  font-size: 11px;
  min-width: 155px;
  max-width: 230px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.top-search {
  position: relative;
  display: flex;
  flex: 1;
  max-width: 650px;
  width: auto;
  gap: 0;
  margin: 0 auto;
}
.top-search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #8293a6;
  z-index: 1;
}
.top-search input {
  height: 40px;
  padding: 0 76px 0 38px;
  border-radius: 10px;
  background: #f7f9fc;
  border: 1px solid #e1e8f0;
}
.top-search input:focus {
  background: #fff;
}
.top-search button {
  height: 32px;
  align-self: center;
  margin-left: 7px;
  padding: 0 12px;
  border-radius: 8px;
}
.search-shortcut {
  position: absolute;
  right: 76px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 10px;
  color: #8a98a8;
  border: 1px solid #d9e1e9;
  border-radius: 5px;
  background: #fff;
  padding: 2px 5px;
  pointer-events: none;
}
.top-actions {
  gap: 9px;
  white-space: nowrap;
}
.top-divider {
  width: 1px;
  height: 30px;
  background: #e3e9f0;
  margin: 0 2px;
}
.top-icon-button {
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: transparent;
  color: #64778b;
  padding: 0;
  transition:
    background 0.18s,
    color 0.18s,
    transform 0.18s;
}
.top-icon-button:hover,
.top-icon-button:focus-visible {
  background: #ffffff;
  color: var(--theme-accent, #fa7737);
  box-shadow: 0 3px 12px rgba(250, 119, 55, 0.28), 0 0 0 2px var(--theme-accent, #fa7737);
  outline: none;
  transform: translateY(-1px);
}
.ux-system-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid #bae8d8;
  background: #edfbf6;
  color: #087a58;
  font-weight: 600;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 11px;
}
.ux-system-pill[data-mode='offline'] {
  border-color: #f3c6c8;
  background: #fff1f2;
  color: #b4232a;
}
.ux-system-pill[data-mode='checking'] {
  border-color: #f0d89e;
  background: #fff9e6;
  color: #8a6500;
}
.ux-status-icon {
  font-size: 15px !important;
  margin: 0 !important;
}
.ux-top-user-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  line-height: 1.12;
  max-width: 185px;
}
.ux-top-user-meta strong {
  font-size: 12px;
  color: #1a3657;
  max-width: 185px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ux-top-user-meta small {
  font-size: 10px;
  color: #7d8da0;
  margin-top: 3px;
}
.ux-avatar-button {
  cursor: pointer;
  outline: none;
  transition:
    box-shadow 0.2s,
    transform 0.2s;
}
.ux-avatar-button:hover,
.ux-avatar-button:focus-visible {
  box-shadow: 0 0 0 3px rgba(46, 140, 231, 0.18);
  transform: translateY(-1px);
}
.ux-notification-wrap {
  position: relative;
}
.ux-notification-count {
  position: absolute;
  right: -2px;
  top: -3px;
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 999px;
  background: #ef4444;
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  display: grid;
  place-items: center;
  border: 2px solid #fff;
}
.ux-notification-menu {
  position: absolute;
  right: 0;
  top: 48px;
  width: min(360px, calc(100vw - 30px));
  max-height: 430px;
  overflow: auto;
  background: #fff;
  border: 1px solid var(--ui-border);
  border-radius: 12px;
  box-shadow: var(--ui-shadow-lg);
  z-index: 80;
}
.ux-notification-head {
  padding: 13px 15px;
  border-bottom: 1px solid #edf1f5;
  background: #f8fafc;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.ux-notification-list button {
  width: 100%;
  border: 0;
  background: #fff;
  text-align: left;
  padding: 13px 15px;
  border-bottom: 1px solid #f0f3f6;
  display: block;
  color: var(--ui-text);
}
.ux-notification-list button:hover {
  background: #f5f9ff;
}
.ux-notification-list strong {
  display: block;
  font-size: 12px;
  margin-bottom: 4px;
}
.ux-notification-list small {
  display: block;
  color: #728398;
  font-size: 10px;
  white-space: normal;
}
.ux-notification-empty {
  padding: 24px;
  text-align: center;
  color: #7a8c9f;
}

/* Content */
.content {
  flex: 1;
  overflow: auto;
  max-width: none;
  width: 100%;
  padding: var(--ui-content-pad-top) var(--ui-content-pad-x) var(--ui-content-pad-bottom);
}
.content > * {
  box-sizing: border-box;
  width: 100% !important;
  max-width: none !important;
  min-width: 0;
  margin-left: 0 !important;
  margin-right: 0 !important;
}
.content > .dash-page,
.content > .dash26-page,
.content > .track25-page,
.content > .admin35,
.content > .admin39-settings {
  width: 100% !important;
  max-width: none !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
}
.page-head {
  margin-bottom: 20px;
  align-items: center;
}
.page-head h1 {
  font-size: 25px;
  color: #102c58;
  font-weight: 700;
}
.page-head p {
  font-size: 13px;
  color: #6d8198;
}
.ui-title {
  display: flex;
  align-items: center;
  gap: 13px;
}
.ui-title-icon {
  width: 42px;
  height: 42px;
  border-radius: 9px;
  background: #e4f1ff;
  color: #075de6;
  display: grid;
  place-items: center;
  font-size: 24px;
}
.actions {
  gap: 8px;
}
.primary,
.secondary,
.outline,
.danger {
  border-radius: 9px;
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
}
.primary {
  background: #0761e7;
  box-shadow: 0 4px 10px rgba(18, 105, 211, 0.18);
}
.primary:hover {
  background: #064fbf;
}
.outline {
  border-color: #c8d9ea;
  color: #245f9e;
}
.card,
.ui-panel {
  background: #fff;
  border: 1px solid #e2eaf3;
  border-radius: 12px;
  box-shadow: var(--ui-shadow);
}
.card {
  padding: 18px;
}
.ui-panel {
  padding: 17px;
}
.stats {
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.stat {
  min-height: 116px;
  background: linear-gradient(145deg, #fff, #f3f9ff);
  border-color: #d2e8fa;
}
.stat strong {
  font-size: 30px;
  color: #0c2856;
}
.stat small {
  font-size: 13px;
  font-weight: 600;
  color: #23456e;
}
.stat-icon {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  background: #dceeff;
  color: #0766db;
  font-size: 24px;
}
.stats .stat:nth-child(2) {
  background: linear-gradient(145deg, #fff, #fff7e9);
  border-color: #ffe5b5;
}
.stats .stat:nth-child(2) .stat-icon {
  background: #fff0cf;
  color: #d78b0a;
}
.stats .stat:nth-child(3) {
  background: linear-gradient(145deg, #fff, #fff1f3);
  border-color: #ffd8de;
}
.stats .stat:nth-child(3) .stat-icon {
  background: #ffe1e6;
  color: #dc4657;
}
.stats .stat:nth-child(4) {
  background: linear-gradient(145deg, #fff, #ecfbf5);
  border-color: #c9f0df;
}
.stats .stat:nth-child(4) .stat-icon {
  background: #daf6e9;
  color: #0a9c71;
}
.ui-grid-2 {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr);
  gap: 18px;
}
.ui-panel-title {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0 0 14px;
  font-size: 16px;
  font-weight: 700;
  color: #12345f;
}
.ui-panel-title .ui-title-icon {
  width: 31px;
  height: 31px;
  font-size: 18px;
  border-radius: 7px;
}
.ui-toast-tag {
  padding: 4px 9px;
  border-radius: 12px;
  background: #e3f1ff;
  color: #0865d4;
  font-size: 11px;
}
.ui-admin-badge {
  background: #dceeff;
  color: #1371c5;
  font-size: 11px;
  border-radius: 18px;
  padding: 5px 10px;
  white-space: nowrap;
}
.ui-badge-green {
  background: #dcf8ea;
  color: #078a65;
}
.ui-bar-label {
  display: grid;
  grid-template-columns: minmax(105px, 140px) 1fr 44px;
  gap: 8px;
  align-items: center;
  margin: 13px 0;
}
.ui-bar-track {
  background: #edf2f7;
  border-radius: 999px;
  height: 9px;
  overflow: hidden;
}
.ui-bar-track i {
  height: 100%;
  background: linear-gradient(90deg, #176bdf, #31b5d4);
  display: block;
  border-radius: 999px;
}
.ui-chart {
  width: 100%;
  overflow: hidden;
}
.ui-chart svg {
  width: 100%;
  height: 330px;
  display: block;
}
.ui-chart text {
  font:
    10px 'Noto Sans Thai',
    sans-serif;
  fill: #71849a;
}
.ui-chart line {
  stroke: #e6edf4;
}
.ui-chart .total-bar {
  fill: #8b0000;
  opacity: 0.22;
}
.ui-chart .chart-line {
  fill: none;
  stroke-width: 2.25;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ui-chart .chart-point {
  fill: #fff;
  stroke-width: 2;
}
.ui-chart-legend {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px 16px;
  margin-top: 8px;
  font-size: 11px;
  color: #617489;
}
.ui-chart-key {
  display: flex;
  align-items: center;
  gap: 5px;
}
.ui-chart-swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  display: inline-block;
}
.ui-workflow {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 7px;
}
.ui-step {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  min-width: 0;
}
.ui-step span {
  display: grid;
  place-items: center;
  width: 29px;
  height: 29px;
  border-radius: 8px;
  background: #e5f3ff;
  color: #0761e7;
  flex: none;
}
.ui-step b {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Forms and tables */
.field,
input,
select,
textarea {
  border-color: #d7e2ed;
  border-radius: 9px;
}
.table-wrap {
  border-radius: 8px;
}
.table {
  white-space: nowrap;
}
.table th {
  background: #f2f6fa;
  color: #526b85;
  font-weight: 600;
  padding: 12px;
}
.table td {
  color: #2e4c6d;
  padding: 12px;
}
.table tr:hover td {
  background: #f7fbff;
}
.table tr.selected td {
  background: #eaf4ff;
}
.filters,
.ui-toolbar {
  gap: 10px;
}
.ui-toolbar {
  display: flex;
  align-items: end;
  flex-wrap: wrap;
}
.ui-toolbar label {
  min-width: 155px;
  flex: 1;
}
.ui-toolbar input,
.ui-toolbar select {
  height: 40px;
}
.form-grid {
  gap: 14px;
}
.ui-steps-form {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 300px;
  gap: 16px;
}
.ui-form-section {
  padding: 18px;
  margin-bottom: 13px;
}
.ui-form-section h3 {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 17px;
  margin: 0 0 15px;
}
.ui-form-section h3 > span {
  border-radius: 50%;
  background: #0867ed;
  color: #fff;
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
}
.ui-hint-panel {
  position: sticky;
  top: calc(var(--topbar-height, 68px) + 14px);
  align-self: start;
}
.ui-hint-panel li {
  list-style: none;
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-left: 2px dotted #b1d2f5;
  margin-left: 10px;
  padding-left: 14px;
}
.ui-hint-panel li b {
  color: #0863e4;
}
.ui-asset-card {
  display: flex;
  align-items: center;
  gap: 15px;
  border: 1px solid #c9e6fc;
  border-radius: 9px;
  background: linear-gradient(110deg, #effaff, #fff);
  padding: 12px;
}
.ui-asset-card .asset-icon {
  font-size: 30px;
  color: #0d65d9;
  background: #dff9eb;
  padding: 13px;
  border-radius: 8px;
}
.ui-drop {
  border: 2px dashed #b7d7f3;
  border-radius: 9px;
  display: grid;
  place-items: center;
  text-align: center;
  min-height: 123px;
  background: #f9fcff;
  cursor: pointer;
  padding: 12px;
}
.ui-drop input {
  border: 0;
}

/* Ticket / Inventory drawers
   R7 fix: scope drawer behaviour ONLY to ticket/inventory panels.
   manageEditor also uses .ui-side and must stay visible in the management grid. */
.ui-split {
  display: block;
}
.ui-split > div {
  min-width: 0;
}
#ticketSide.ui-side,
#inventorySide.ui-side {
  position: fixed;
  right: 0;
  top: var(--topbar-height);
  bottom: 0;
  width: min(450px, 92vw);
  max-height: none;
  z-index: 61;
  border: 0;
  border-left: 1px solid #dce7f1;
  border-radius: 0;
  background: #fff;
  padding: 0;
  overflow: auto;
  box-shadow: -15px 0 35px rgba(10, 34, 63, 0.15);
  transform: translateX(104%);
  visibility: hidden;
  pointer-events: none;
  transition:
    transform 0.28s ease,
    visibility 0.28s;
}
#ticketSide.ui-side.ux5-drawer-open,
#inventorySide.ui-side.ux5-drawer-open {
  transform: translateX(0);
  visibility: visible;
  pointer-events: auto;
}
#ticketSide.ui-side > *,
#inventorySide.ui-side > * {
  margin-left: 18px;
  margin-right: 18px;
}
#ticketSide.ui-side > .ui-side-head,
#inventorySide.ui-side > .ui-side-head {
  margin: 0;
  padding: 16px 18px;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px);
  position: sticky;
  top: 0;
  z-index: 3;
  border-bottom: 1px solid #edf1f5;
}
.ui-side-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}
.ui-side-head h2 {
  font-size: 18px;
  margin: 0;
}
.ui-side-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid #e4ebf3;
  margin-top: 12px;
  margin-bottom: 14px;
}
.ui-side-tabs button {
  border: 0;
  background: none;
  padding: 10px 8px;
  color: #647b95;
}
html[data-theme] .ui-side-tabs button.active,
.ui-side-tabs button.active {
  color: var(--theme-accent, #fa7737) !important;
  border-bottom: 3px solid var(--theme-accent, #fa7737) !important;
  font-weight: 700;
}
.ui-detail {
  display: grid;
  grid-template-columns: 125px 1fr;
  gap: 8px 12px;
  padding: 12px;
  border: 1px solid #e1eaf4;
  border-radius: 9px;
  background: #fbfdff;
}
.ui-detail b {
  font-weight: 500;
  color: #60768f;
}
.ui-detail span {
  overflow-wrap: anywhere;
}
.ui-history {
  border-left: 2px solid #b8d7f6;
  margin-left: 12px;
  padding-left: 18px;
}
.ui-history li {
  list-style: none;
  position: relative;
  margin-bottom: 17px;
}
.ui-history li:before {
  content: '✓';
  position: absolute;
  left: -30px;
  top: 0;
  background: #0866ec;
  color: #fff;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 11px;
  font-weight: 700;
}
.ui-history li:last-child:before {
  background: #e7a22e;
}
.ux-drawer-close {
  border: 0;
  background: transparent;
  color: var(--theme-heading, #051344);
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  max-width: 36px;
  max-height: 36px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  padding: 0;
  margin: 0;
  flex: none;
  cursor: pointer;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.15s ease;
}
.ux-drawer-close:hover {
  background-color: color-mix(in srgb, var(--theme-accent, #fa7737) 14%, transparent);
  color: var(--theme-accent, #fa7737);
}
.ux-drawer-close:active {
  background-color: color-mix(in srgb, var(--theme-accent, #fa7737) 24%, transparent);
  color: var(--theme-action, #e05316);
  transform: scale(0.92);
}
.ux-drawer-backdrop {
  position: fixed;
  left: 0;
  right: 0;
  top: var(--topbar-height);
  bottom: 0;
  background: rgba(9, 28, 51, 0.28);
  z-index: 60;
  backdrop-filter: blur(1px);
}

  display: grid;

  width: 100%;

}
.ui-management {

#manageEditor.ui-side {

  padding: 18px;

}

.ui-management .table-wrap {

}

}
.ui-side label {
  margin-bottom: 11px;
}
.ui-note {
  background: #e8f5ff;

  padding: 10px;

}

/* V1.0.18 — Professional Login Processing */
.login-card {
  position: relative;
  overflow: hidden;
}
.login-submit {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease,
    opacity 0.18s ease;
}
.login-submit:disabled {
  cursor: wait;
  opacity: 0.78;
  transform: none;
  box-shadow: none;
}
.login-submit .material-symbols-rounded {
  font-size: 19px;
}
.login-progress {
  position: absolute;
  inset: 0;
  z-index: 8;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  background: rgba(255, 255, 255, 0.93);
  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
  animation: loginOverlayIn 0.2s ease both;
}
.login-progress.hidden {
  display: none !important;
}
.login-progress-graphic {
  position: relative;
  width: 94px;
  height: 94px;
  display: grid;
  place-items: center;
  margin-bottom: 20px;
}
.login-spinner {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: 4px solid rgba(13, 99, 220, 0.12);
  border-top-color: #0d63dc;
  border-right-color: #1ba7c9;
  box-shadow: 0 0 28px rgba(13, 99, 220, 0.12);
  animation: loginSpin 0.9s linear infinite;
}
.login-progress-logo {
  position: relative;
  z-index: 2;
  width: 58px;
  height: 58px;
  border-radius: 18px;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #0ea5e9, #1e3a8a);
  color: #fff;
  font-size: 30px;
  box-shadow: 0 10px 24px rgba(13, 70, 145, 0.22);
  animation: loginLogoPulse 1.5s ease-in-out infinite;
}
.login-success-icon {
  display: none;
  position: relative;
  z-index: 3;
  color: #0aa875;
  font-size: 72px;
  filter: drop-shadow(0 8px 18px rgba(10, 168, 117, 0.18));
}
.login-progress-graphic[data-state='success'] .login-spinner,
.login-progress-graphic[data-state='success'] .login-progress-logo {
  display: none;
}
.login-progress-graphic[data-state='success'] .login-success-icon {
  display: block;
  animation: loginSuccessPop 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.35) both;
}
.login-progress strong {
  font-size: 18px;
  color: #0d2b58;
  margin-bottom: 5px;
}
.login-progress > span:not(.login-progress-graphic) {
  color: #5f748b;
  font-size: 13px;
}
.login-progress > small {
  margin-top: 7px;
  color: #8b9caf;
  font-size: 11px;
}
.login-error-shake {
  animation: loginErrorShake 0.36s ease;
}
.ui-theme-dark .login-progress {
  background: rgba(10, 25, 54, 0.94);
}
.ui-theme-dark .login-progress strong {
  color: #f1f5f9;
}
.ui-theme-dark .login-progress > span:not(.login-progress-graphic) {
  color: #c1cfdd;
}
.ui-theme-dark .login-progress > small {
  color: #91a4b7;
}
@keyframes loginSpin {
  to {
    transform: rotate(360deg);
  }
}
@keyframes loginLogoPulse {
  0%,
  100% {
    transform: scale(0.96);
  }
  50% {
    transform: scale(1.04);
  }
}
@keyframes loginOverlayIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes loginSuccessPop {
  0% {
    opacity: 0;
    transform: scale(0.55);
  }
  70% {
    transform: scale(1.08);
  }
  100% {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes loginErrorShake {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-7px);
  }
  50% {
    transform: translateX(6px);
  }
  75% {
    transform: translateX(-3px);
  }
}
@media (prefers-reduced-motion: reduce) {
  .sidebar nav button,
  .sidebar nav button .ico {
    transition: none !important;
    transform: none !important;
  }
  .login-spinner,
  .login-progress-logo,
  .login-success-icon,
  .login-error-shake,
  .login-progress {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
  }
}

.track25-workflow {
  display: grid;

  gap: 18px;

  margin-bottom: 16px;

}

  min-width: 0;

.track25-stepper {
  display: grid;

  position: relative;
  gap: 0;

}
.track25-stepper:before {
  content: '';
  position: absolute;
  left: 12.5%;
  right: 12.5%;

  background: #cad8e8;
}
.track25-step {
  position: relative;

}

  border-radius: 50%;
}
.track25-step.done:after {
  content: '';
  position: absolute;
  top: 23px;
  left: -50%;
  width: 100%;
  height: 2px;
  background: #3b91fa;
  z-index: -1;
}

/* Workflow: connector segments start/end at circle edges, never pass through circles. */
.track25-stepper:before {
  display: none !important;
}
.track25-step {
  z-index: auto;
}
.track25-step::before {
  content: '';
  position: absolute;
  top: 21px;
  left: calc(50% + 22px);
  width: calc(100% - 44px);
  height: 2px;
  background: #cad8e8;
  z-index: 0;

.track25-step:last-child::before {
  display: none;
}
.track25-step.done::before {

}

  display: none !important;
}

  position: relative;

}

  border: 3px solid #1674ed;
  background: #fff;
  color: #1674ed;
  box-shadow: 0 0 0 4px #e3efff;

}

}

}

  border-color: #5ca4ff;
  box-shadow: 0 0 0 4px #203d61;

   No icon-font dependency inside workflow circles. */

  line-height: 0;
}

  display: none !important;
}

  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  box-sizing: border-box;
  transform: translate(-50%, -50%);
}

  width: 13px;
  height: 7px;

  width: 13px;
  height: 13px;
  border-radius: 50%;

.track25-step.pending .track25-step-dot::after {
  display: none;

.admin35-icon-img {

@media (max-width: 1100px) {
  .admin35-grid.kpi {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .admin35-settings-grid {
    grid-template-columns: 1fr;
  }
  .admin35-perm-layout {
    grid-template-columns: 1fr;
  }
  .admin35-role-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

    display: block;
  }
  .admin35-actions {
    justify-content: flex-start;
    margin-top: 12px;
  }
  .admin35-grid.kpi {
    grid-template-columns: 1fr;
  }
  .admin35-form-grid {
    grid-template-columns: 1fr;
  }
  .admin35-form-grid .wide {
    grid-column: auto;
  }
  .admin35-icon-panel {
    grid-template-columns: 1fr;
  }
  .admin35-toolbar > * {
    max-width: none !important;
    width: 100%;
  }
  .admin35-search {
    max-width: none;
  }
  .admin35-role-list {
    grid-template-columns: 1fr;
  }
  .admin35-card {
    padding: 14px;
  }
  .admin35-table {
    min-width: 760px;
  }
}

.admin36-avatar.tone-blue {
  background: #e6f2ff;
  color: #1677f0;
}
.admin36-role-pill,
.admin36-state-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 7px;
  font-size: 9.5px;
  font-weight: 700;
  line-height: 1.2;
}
.admin36-role-pill.role-admin {
  background: #ffe6e9;
  color: #e0434e;
}
.admin36-role-pill.role-manager {
  background: #fff0d9;
  color: #d98314;
}
.admin36-role-pill.role-technician {
  background: #eeeaff;
  color: #674ed8;
}
.admin36-role-pill.role-user {
  background: #e7f2ff;
  color: #2574d8;
}
.admin36-state-pill {
  border-radius: 999px;
}
.admin36-state-pill.state-on {
  background: #dff8e9;
  color: #138451;
}
.admin36-state-pill.state-off {
  background: #ffe9eb;
  color: #db3340;
}
.admin36-state-pill.state-locked {
  background: #fff2d7;
  color: #9a690e;
}
.admin36-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: currentColor;
}
.admin36-row-actions {
  display: flex;
  justify-content: center;
  gap: 5px;
}
.admin36-row-actions button {
  width: 31px;
  height: 31px;
  padding: 0;
  border: 1px solid #d6e1ee;
  border-radius: 7px;
  background: #fff;
  color: #254c75;
  display: grid;
  place-items: center;
}
.admin36-row-actions button .material-symbols-rounded {
  font-size: 18px;
}
.admin36-row-actions button.danger {
  color: #ef3a47;
  background: #fff1f2;
  border-color: #ffdadd;
}
.admin36-pager {
  height: 58px;
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  color: #5e738f;
  font-size: 10.5px;
}
.admin36-pages {
  display: flex;
  align-items: center;
  gap: 5px;
}
.admin36-pages button {
  min-width: 30px;
  height: 30px;
  padding: 0 7px;
  border: 1px solid #dce5ef;
  background: #fff;
  color: #5b7390;
  border-radius: 6px;
}
.admin36-pages button.active {
  background: #1f7df1;
  color: #fff;
  border-color: #1f7df1;
}
.admin36-pages .material-symbols-rounded {
  font-size: 18px;
  vertical-align: middle;
}
.admin36-pages .ellipsis {
  padding: 0 3px;
}
.admin36-pager select {
  height: 33px;
  padding: 0 27px 0 10px;
  width: auto;
  min-width: 112px;
  font-size: 10px;
}
.admin36-user-detail {
  padding: 16px 15px;
  display: flex;
  flex-direction: column;
}
.admin36-detail-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.admin36-detail-head h3 {
  margin: 0;
  font-size: 15px;
  color: #1f314a;
}
.admin36-detail-head button {
  border: 0;
  background: transparent;
  color: #7086a1;
  padding: 3px;
}
.admin36-profile-block {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding-bottom: 15px;
  border-bottom: 1px solid #e9eff6;
}
.admin36-profile-block h2 {
  font-size: 15px;
  margin: 3px 0 2px;
  color: #233651;
}
.admin36-profile-block b {
  font-size: 11px;
  color: #2f4764;
}
.admin36-profile-badges {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}
.admin36-user-meta {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 10px 8px;
  padding: 15px 0;
  margin: 0;
  border-bottom: 1px solid #e9eff6;
  font-size: 10.5px;
}
.admin36-user-meta dt {
  display: flex;
  align-items: center;
  gap: 7px;
  color: #647c97;
}
.admin36-user-meta dt .material-symbols-rounded {
  font-size: 17px;
  color: #3d658e;
}
.admin36-user-meta dd {
  margin: 0;
  text-align: right;
  color: #2c4663;
  overflow-wrap: anywhere;
}
.admin36-rights-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 13px;
}
.admin36-rights-head h4 {
  font-size: 12px;
  margin: 0;
  color: #263c58;
}
.admin36-rights-head span {
  font-size: 10px;
  color: #1f7df1;
}
.admin36-rights {
  list-style: none;
  margin: 9px 0 14px;
  padding: 10px 11px;
  border-radius: 9px;
  background: #f3f8ff;
}
.admin36-rights li {
  display: flex;
  gap: 7px;
  align-items: center;
  margin: 6px 0;
  color: #3b5674;
  font-size: 10px;
}
.admin36-rights .material-symbols-rounded {
  font-size: 16px;
  color: #19a966;
}
.admin36-detail-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: auto;
}
.admin36-detail-actions button {
  min-height: 38px;
  padding: 7px 8px;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.admin36-detail-actions button:last-child {
  grid-column: 1/-1;
}
.admin36-detail-actions .material-symbols-rounded {
  font-size: 17px;
}

/* Permission role summary */
.admin36-role-cards {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}
.admin36-role-summary {
  position: relative;
  border: 2px solid #fff;
  background: #fff;
  border-radius: 15px;
  min-height: 147px;
  padding: 17px 36px 15px 16px;
  display: flex;
  align-items: flex-start;
  gap: 13px;
  text-align: left;
  box-shadow: var(--a36-shadow);
  color: #1c2f49;
  overflow: hidden;
}
.admin36-role-summary.tone-blue {
  background: linear-gradient(135deg, #fff, #f1f7ff);
}
.admin36-role-summary.tone-green {
  background: linear-gradient(135deg, #fff, #f0fcf5);
}
.admin36-role-summary.tone-orange {
  background: linear-gradient(135deg, #fff, #fff8ed);
}
.admin36-role-summary.tone-purple {
  background: linear-gradient(135deg, #fff, #f8f5ff);
}
.admin36-role-summary.active {
  border-color: #dfe8f5;
}
.admin36-role-summary-icon {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  flex: none;
}
.admin36-role-summary-icon .material-symbols-rounded {
  font-size: 39px;
}
.tone-blue .admin36-role-summary-icon,
.admin36-role-mini-icon.tone-blue {
  background: #dcecff;
  color: #1778f2;
}
.tone-green .admin36-role-summary-icon,
.admin36-role-mini-icon.tone-green {
  background: #daf7e5;
  color: #12a45f;
}
.tone-orange .admin36-role-summary-icon,
.admin36-role-mini-icon.tone-orange {
  background: #ffeed3;
  color: #ed8f1c;
}
.tone-purple .admin36-role-summary-icon,
.admin36-role-mini-icon.tone-purple {
  background: #eadfff;
  color: #7136d9;
}
.admin36-role-summary-text {
  display: flex;
  flex-direction: column;
  min-width: 0;
}
.admin36-role-summary-text > b {
  font-size: 17px;
  color: #162039;
}
.admin36-role-summary-text > small {
  font-size: 11.5px;
  color: #607490;
  line-height: 1.55;
  margin-top: 4px;
  white-space: normal;
  min-height: 36px;
}
.admin36-role-summary-text > em {
  font-size: 10.5px;
  color: #536985;
  font-style: normal;
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 9px;
}
.admin36-role-summary-text > em .material-symbols-rounded {
  font-size: 17px;
}
.admin36-role-arrow {
  position: absolute;
  right: 14px;
  top: 18px;
  font-size: 22px;
}
.tone-blue .admin36-role-arrow {
  color: #2c76dc;
}
.tone-green .admin36-role-arrow {
  color: #149e5c;
}
.tone-orange .admin36-role-arrow {
  color: #d88a26;
}
.tone-purple .admin36-role-arrow {
  color: #7045c4;
}

/* Permission shell */
.admin36-perm-shell {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 14px;
}
.admin36-role-panel,
.admin36-matrix-panel {
  background: #fff;
  border: 1px solid var(--a36-line);
  border-radius: 14px;
  box-shadow: var(--a36-shadow);
  overflow: hidden;
}
.admin36-role-panel {
  padding: 15px 14px;
}
.admin36-role-panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  margin-bottom: 12px;
}
.admin36-role-panel-head h3 {
  font-size: 15px;
  color: #1f314a;
  margin: 0;
}
.admin36-add-role {
  border: 1px solid #78aef5;
  background: #fff;
  color: #1974e5;
  border-radius: 8px;
  padding: 7px 10px;
  display: flex;
  gap: 5px;
  align-items: center;
  font-size: 10.5px;
}
.admin36-add-role .material-symbols-rounded {
  font-size: 18px;
}
.admin36-role-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
}
.admin36-role-list-item {
  position: relative;
  width: 100%;
  min-height: 67px;
  border: 1px solid #e3eaf3;
  background: #fff;
  border-radius: 9px;
  padding: 9px 38px 9px 9px;
  display: grid;
  grid-template-columns: 45px 1fr auto;
  gap: 9px;
  align-items: center;
  text-align: left;
  color: #233d5a;
}
.admin36-role-list-item.active {
  border-color: #fa7737;
  background: linear-gradient(135deg, rgba(250, 119, 55, 0.22), rgba(234, 88, 12, 0.12));
  box-shadow: 0 0 0 1px #fa7737 inset, 0 4px 14px rgba(250, 119, 55, 0.2);
}
.admin36-role-mini-icon {
  width: 43px;
  height: 43px;
  border-radius: 50%;
  display: grid;
  place-items: center;
}
.admin36-role-mini-icon .material-symbols-rounded {
  font-size: 25px;
}
.admin36-role-list-item b {
  display: block;
  font-size: 12px;
}
.admin36-role-list-item small {
  display: block;
  font-size: 9.5px;
  color: #6f849d;
  margin-top: 2px;
}
.admin36-role-list-item em {
  font-style: normal;
  font-size: 10px;
  background: #f0f4f8;
  color: #657991;
  padding: 5px 10px;
  border-radius: 999px;
}
.admin36-role-more {
  position: absolute;
  right: 9px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 19px;
  color: #4f6580;
}
.admin36-matrix-panel {
  padding: 15px 14px;
  display: flex;
  flex-direction: column;
}
.admin36-matrix-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 11px;
}
.admin36-matrix-head h2 {
  font-size: 16px;
  margin: 0;
  color: #1f314a;
}
.admin36-matrix-head p {
  font-size: 10.5px;
  margin: 3px 0 0;
  color: #7387a1;
}
.admin36-legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.admin36-legend > span {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: #667b95;
}
.admin36-matrix-wrap {
  border: 1px solid #e3eaf3;
  border-radius: 9px;
  overflow: auto;
}
.admin36-permission-matrix {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  min-width: 680px;
}
.admin36-permission-matrix th {
  height: 40px;
  background: #f7f9fc;
  color: #394f6b;
  font-size: 10px;
  border-right: 1px solid #e6edf5;
  border-bottom: 1px solid #dfe7f0;
  text-align: center;
}
.admin36-permission-matrix th:first-child {
  text-align: left;
  padding-left: 13px;
  width: 34%;
}
.admin36-permission-matrix th:not(:first-child),
.admin36-permission-matrix td:not(:first-child) {
  width: 13.2%;
}
.admin36-permission-matrix td {
  height: 35px;
  border-right: 1px solid #e9eef4;
  border-bottom: 1px solid #e9eef4;
  text-align: center;
  padding: 3px 4px;
}
.admin36-permission-matrix tr:last-child td {
  border-bottom: 0;
}
.admin36-permission-matrix th:last-child,
.admin36-permission-matrix td:last-child {
  border-right: 0;
}
.admin36-permission-matrix td:first-child {
  text-align: left;
}
.admin36-menu-label {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 10.5px;
  color: #273e5a;
}
.admin36-menu-label .material-symbols-rounded {
  font-size: 18px;
  color: #223b59;
}
.admin36-matrix-role {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-weight: 800;
  font-size: 10px;
  white-space: nowrap;
}
.admin36-matrix-role .material-symbols-rounded {
  font-size: 16px;
}
.admin36-matrix-role.tone-blue {
  color: #1778f2;
}
.admin36-matrix-role.tone-green {
  color: #11a25d;
}
.admin36-matrix-role.tone-orange {
  color: #ed8b18;
}
.admin36-matrix-role.tone-purple {
  color: #7137d8;
}
.admin36-perm-cell {
  border: 0;
  background: transparent;
  padding: 3px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
}
.admin36-perm-cell.editable {
  cursor: pointer;
}
.admin36-perm-cell.editable:hover {
  background: #eef5ff;
}
.admin36-perm-state {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: inline-grid;
  place-items: center;
  font-size: 15px;
  font-weight: 700;
}
.admin36-perm-state.full {
  background: linear-gradient(135deg, #fa7737, #ea580c);
  color: #fff;
  box-shadow: 0 2px 6px rgba(250, 119, 55, 0.35);
}
.admin36-perm-state.limited {
  background: #aab6c5;
  color: #fff;
}
.admin36-perm-state.none {
  background: transparent;
  color: #66758a;
  font-size: 19px;
}
.admin36-perm-footer {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-top: 11px;
}
.admin36-perm-note {
  display: flex;
  gap: 8px;
  align-items: flex-start;
  max-width: 56%;
  padding: 9px 11px;
  background: #fff6d9;
  border: 1px solid #ffe6a0;
  border-radius: 8px;
  color: #8a6016;
  font-size: 9.5px;
  line-height: 1.55;
}
.admin36-perm-note > .material-symbols-rounded {
  font-size: 19px;
  color: #ba7a10;
}
.admin36-perm-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.admin36-perm-actions button {
  height: 39px;
  padding: 0 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
}
.admin36-perm-actions .material-symbols-rounded {
  font-size: 18px;
}

/* Dark compatibility while retaining role/status colors */
.ui-theme-dark .admin36-users,
.ui-theme-dark .admin36-permissions {
  --a36-panel: #10253b;
  --a36-line: #29445f;
  --a36-ink: #edf4fb;
  --a36-muted: #9eb1c4;
}
.ui-theme-dark .admin36-user-kpi,
.ui-theme-dark .admin36-user-toolbar,
.ui-theme-dark .admin36-user-list,
.ui-theme-dark .admin36-user-detail,
.ui-theme-dark .admin36-role-summary,
.ui-theme-dark .admin36-role-panel,
.ui-theme-dark .admin36-matrix-panel,
.ui-theme-dark .admin36-role-list-item {
  background: #10253b;
  border-color: #29445f;
  box-shadow: none;
}
.ui-theme-dark .admin36-user-kpi b,
.ui-theme-dark .admin36-kpi-number,
.ui-theme-dark .admin36-detail-head h3,
.ui-theme-dark .admin36-profile-block h2,
.ui-theme-dark .admin36-role-panel-head h3,
.ui-theme-dark .admin36-matrix-head h2,
.ui-theme-dark .admin36-role-summary-text > b,
.ui-theme-dark .admin36-role-list-item b {
  color: #eef5fb;
}
.ui-theme-dark .admin36-user-toolbar input,
.ui-theme-dark .admin36-user-toolbar select,
.ui-theme-dark .admin36-pager select,
.ui-theme-dark .admin36-row-actions button,
.ui-theme-dark .admin36-pages button {
  background: #122b43;
  border-color: #31506d;
  color: #dce8f3;
}
.ui-theme-dark .admin36-user-table th,
.ui-theme-dark .admin36-permission-matrix th {
  background: #142c43;
  color: #aabdd0;
  border-color: #29445f;
}
.ui-theme-dark .admin36-user-table td,
.ui-theme-dark .admin36-permission-matrix td {
  color: #d4e1ed;
  border-color: #223d56;
}
.ui-theme-dark .admin36-user-table tbody tr.is-selected td {
  background: #173a5e;
}
.ui-theme-dark .admin36-user-table tbody tr:hover td {
  background: #142e46;
}
.ui-theme-dark .admin36-user-meta,
.ui-theme-dark .admin36-profile-block {
  border-color: #29445f;
}
.ui-theme-dark .admin36-rights {
  background: #142e46;
}
.ui-theme-dark .admin36-role-list-item.active {
  background: #174d82;
}
.ui-theme-dark .admin36-perm-note {
  background: #40371d;
  border-color: #675927;
  color: #ead695;
}
@media (max-width: 1280px) {
  .admin36-user-toolbar {
    grid-template-columns: 1fr 150px 150px 150px;
  }
  .admin36-toolbar-actions {
    grid-column: 1/-1;
    justify-content: flex-end;
  }
  .admin36-user-shell {
    grid-template-columns: 1fr 330px;
  }
  .admin36-role-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .admin36-perm-shell {
    grid-template-columns: 260px minmax(0, 1fr);
  }
}
@media (max-width: 980px) {
  .admin36-user-kpis {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .admin36-user-shell {
    grid-template-columns: 1fr;
  }
  .admin36-user-detail {
    min-height: 420px;
  }
  .admin36-perm-shell {
    grid-template-columns: 1fr;
  }
  .admin36-role-list {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .admin36-perm-footer {
    align-items: stretch;
    flex-direction: column;
  }
  .admin36-perm-note {
    max-width: none;
  }
  .admin36-perm-actions {
    justify-content: flex-start;
  }
}
@media (max-width: 700px) {
  .admin36-users .admin35-title h1,
  .admin36-permissions .admin35-title h1 {
    font-size: 28px;
  }
  .admin36-user-kpis,
  .admin36-role-cards,
  .admin36-role-list {
    grid-template-columns: 1fr;
  }
  .admin36-user-toolbar {
    grid-template-columns: 1fr;
  }
  .admin36-toolbar-actions {
    grid-column: auto;
    display: grid;
    grid-template-columns: 1fr;
  }
  .admin36-user-shell {
    display: block;
  }
  .admin36-user-detail {
    margin-top: 12px;
  }
  .admin36-pager {
    grid-template-columns: 1fr;
    gap: 8px;
    height: auto;
    padding: 12px;
  }
  .admin36-pages {
    justify-content: flex-start;
  }
  .admin36-role-summary {
    min-height: 120px;
  }
  .admin36-matrix-head {
    display: block;
  }
  .admin36-legend {
    justify-content: flex-start;
    margin-top: 9px;
  }
  .admin36-perm-actions {
    display: grid;
    grid-template-columns: 1fr;
    width: 100%;
  }
  .admin36-perm-actions button {
    justify-content: center;
  }
}

/* V1.0.39 System Settings */
.admin39-settings {
  width: 100%;
  max-width: none;
  margin: 0;
}
.admin39-settings-layout {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(430px, 0.85fr);
  gap: 16px;
}
.admin39-panel {
  background: #fff;
  border: 1px solid #dfe8f2;
  border-radius: 15px;
  padding: 18px;
  box-shadow: 0 8px 22px rgba(36, 73, 112, 0.06);
  min-width: 0;
}
.admin39-section-head {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  margin-bottom: 16px;
}
.admin39-section-head > span {
  width: 43px;

/* V1.0.43 Branding action hierarchy */
.admin39-brand-column {
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.admin39-brand-action {
  width: 100%;
  min-height: 42px;
  margin-top: 14px;
  border: 0;
  white-space: nowrap;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-weight: 700;
  box-shadow: 0 6px 14px rgba(24, 55, 86, 0.12);
  transition:
    filter 0.18s,
    transform 0.18s,
    box-shadow 0.18s;
}
.admin39-brand-action .material-symbols-rounded {
  font-size: 18px;
  margin: 0;
}
.admin39-brand-action:hover:not(:disabled) {
  filter: brightness(0.94);
  transform: translateY(-1px);
  box-shadow: 0 8px 16px rgba(24, 55, 86, 0.16);
}
.admin39-brand-action:focus-visible {
  outline: 3px solid rgba(37, 99, 235, 0.24);
  outline-offset: 2px;
}
.admin39-brand-action:disabled {
  opacity: 0.48;
  cursor: not-allowed;
  box-shadow: none;
}
.admin39-brand-upload-btn {
  background: #0b63ce !important;
  color: #fff !important;
  margin-top: auto;
}
.admin39-brand-reset-btn {
  background: #b45309 !important;
  color: #fff !important;
  margin-top: auto;
  width: calc(100% + 30px);
  margin-left: -15px;
  margin-right: -15px;
}
.admin39-brand-save-btn {
  background: #166534 !important;
  color: #fff !important;
  margin-top: auto;
}
.ui-theme-dark .admin39-brand-upload-btn {
  background: #1d6fd6 !important;
}
.ui-theme-dark .admin39-brand-reset-btn {
  background: #c15c08 !important;
}
.ui-theme-dark .admin39-brand-save-btn {
  background: #18723a !important;
}
@media (max-width: 760px) {
  .admin39-brand-action {
    margin-top: 12px;
  }
  .admin39-brand-upload-btn,
  .admin39-brand-reset-btn,
  .admin39-brand-save-btn {
    margin-top: 12px;
  }
  .admin39-brand-reset-btn {
    width: 100%;
    margin-left: 0;
    margin-right: 0;
  }
}

/* V1.0.56: Every permission symbol has an actual circular border, including lock. */

/**

 * File: action-permissions.css
 * Version: V1.0.71
 * Stage: beta
 * Purpose: Ordered styles for action-permissions
 * Notes:
 * - No secrets in source code
 * - Preserve existing data and backward compatibility
 * Modified: 2026-10-25
 * Change History:
 * - V1.0.71: Consolidated adjacent style sections; preserve cascade order.
 */
.permission-admin-panel {
  display: grid;
  gap: 16px;
}
.permission-admin-head {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.permission-admin-head h2 {
  margin: 0;
}
.permission-admin-head p {
  margin: 4px 0 0;
  color: var(--muted, #667085);
}

  font-size: 12px;
  background: #f3f6fb;
  border: 1px solid #d9e2ef;
  border-radius: 6px;
  padding: 2px 6px;
}
.switch-mini {
  display: inline-flex;
  align-items: center;
  cursor: pointer;
}
.switch-mini input {
  display: none;
}
.switch-mini span {
  width: 38px;
  height: 22px;
  border-radius: 999px;
  background: #cbd5e1;
  position: relative;
  display: inline-block;
  transition: 0.2s;
}
.switch-mini span:before {
  content: '';
  position: absolute;
  left: 3px;
  top: 3px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  transition: 0.2s;
}
.switch-mini input:checked + span {
  background: #2563eb;
}
.switch-mini input:checked + span:before {
  transform: translateX(16px);
}
.switch-mini input:disabled + span {
  opacity: 0.45;
  cursor: not-allowed;
}

.permission-action-launcher {
  margin-left: 8px;
}

/**
 * Project: OCPB IT Service Desk
 * File: calendar.css

.pm-layout {
  max-width: 1500px;
  margin: auto;
}
.pm-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.pm-top h1 {
  margin: 0;
  color: var(--text, #16365e);
}
.pm-top p {
  margin: 6px 0;
  color: #64748b;
}
.pm-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.pm-actions input {
  min-height: 37px;
  border: 1px solid #d9e2ec;
  border-radius: 8px;
  padding: 5px;
}
.pm-calendar {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  border: 1px solid #dfe7f0;
  background: #dfe7f0;
  gap: 1px;
  border-radius: 10px;
  overflow: hidden;
}
.pm-week {
  padding: 11px 4px;
  text-align: center;
  background: #ecf3fb;
  color: #1c4268;
  font-weight: 700;
}
.pm-day {
  background: var(--card, #fff);
  min-height: 135px;
  padding: 7px;
  min-width: 0;
}
.pm-out {
  background: #f5f7fb;
}
.pm-day-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pm-day-head button {
  border: none;
  color: #1163cf;
  background: transparent;
  cursor: pointer;
  font-size: 20px;
}
.pm-event {
  display: block;
  width: 100%;
  text-align: left;
  border: 0;
  border-left: 3px solid #277cf1;
  border-radius: 5px;
  background: #e6f1ff;
  color: #133c6f;
  padding: 6px;
  margin: 5px 0;
  cursor: grab;
  overflow: hidden;
}
.pm-event strong,
.pm-event small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pm-event small {
  font-size: 11px;
  margin-top: 3px;
}
.pm-1 {
  background: #fff2d7;
  border-color: #f59e0b;
}
.pm-2 {
  background: #d9f8e8;
  border-color: #10a66c;
}
.pm-3 {
  background: #edf0f4;

}
.pm-help {

:root,
html[data-theme] body {
  --bg: var(--theme-bg);
  --card: var(--theme-panel);
  --ink: var(--theme-text);
  --text: var(--theme-text);
  --muted: var(--theme-muted);
  --line: var(--theme-border);
  --ui-bg: var(--theme-bg);
  --ui-card: var(--theme-panel);
  --ui-text: var(--theme-text);
  --ui-muted: var(--theme-muted);
  --ui-border: var(--theme-border);
  --ui-soft: var(--theme-info-bg);
}
html[data-theme] .admin35 {
  --a35-soft: var(--theme-raised);
  --a35-line: var(--theme-border);
  --a35-ink: var(--theme-text);
  --a35-muted: var(--theme-muted);
}
html[data-theme] :is(.admin36-users, .admin36-permissions) {
  --a36-panel: var(--theme-panel);
  --a36-line: var(--theme-border);
  --a36-ink: var(--theme-text);
  --a36-muted: var(--theme-muted);
}
html[data-theme] .itsd65-panel {
  --l65-primary: var(--theme-accent);
  --l65-outline: var(--theme-border);
  --l65-ink: var(--theme-text);
  --l65-muted: var(--theme-muted);
}
html[data-theme] :is(input, select, textarea) {
  caret-color: var(--theme-accent);
  accent-color: #2563eb;
}
html[data-theme] :is(input, textarea)::placeholder {
  color: var(--theme-muted);
  opacity: 1;
}
html[data-theme] ::selection {
  background: var(--theme-selection);
  color: var(--theme-heading);
}
html[data-theme] :is(button, a, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--theme-focus);
  outline-offset: 3px;
}
html[data-theme] * {
  scrollbar-color: var(--theme-scroll) var(--theme-bg);
  scrollbar-width: thin;
}
html[data-theme] :is(.table, .admin35-table, .admin36-user-table, .pm-calendar) {
  font-variant-numeric: tabular-nums;
}
html[data-theme] input::file-selector-button {
  border: 1px solid var(--theme-border);
  border-radius: 5px;
  background: var(--theme-raised);
  color: var(--theme-text);
  padding: 5px 8px;
  cursor: pointer;
}
html[data-theme] .top-icon-button > .material-symbols-rounded {
  width: 1em;
  overflow: hidden;
  pointer-events: none;
}
html[data-theme] .ux-notification-count {
  background: #bc303b;
}
html[data-theme] .itsd65-icon {
  background: #087f38;
}
html[data-theme] .switch-mini {
  position: relative;
}
html[data-theme] .switch-mini input {
  display: block;
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}
html[data-theme] .switch-mini input:focus-visible + span {
  outline: 2px solid var(--theme-focus);
  outline-offset: 3px;
}
html[data-theme='dark'] input:-webkit-autofill {
  -webkit-text-fill-color: var(--theme-text);
  box-shadow: 0 0 0 1000px var(--theme-input) inset;
}

/* Neutral surfaces and readable text; primary actions retain their brand colors. */
html[data-theme='dark'] :is(.card, .ui-panel, .modal-box, .topbar, .ux-notification-menu) {
  background: var(--theme-panel);
  color: var(--theme-text);
  border-color: var(--theme-border);
}
html[data-theme='dark']
  :is(
    label,
    .hint,
    .empty,
    .muted,
    .crumb,
    .crumb b,
    .detail-grid b,
    .ui-detail b,
    .ui-pagination,
    .ui-chart-legend,
    .ui-side-tabs button,
    .ux-notification-empty
  ) {
  color: var(--theme-muted);
}
html[data-theme='dark'] :is(h1, h2, h3, h4, .ui-panel-title, .page-head h1) {
  color: var(--theme-heading);
}
html[data-theme='dark'] :is(input, select, textarea, .field) {
  background: var(--theme-input);
  border-color: var(--theme-border);
  color: var(--theme-text);
}
html[data-theme='dark'] :is(input, select, textarea):disabled {
  background: var(--theme-raised);
  color: var(--theme-muted);
  opacity: 1;
  cursor: not-allowed;
}
html[data-theme='dark'] :is(input, textarea)[readonly] {
  background: var(--theme-raised);
  color: var(--theme-text);
}
html[data-theme='dark'] :is(.link, a:not(.primary)) {
  color: var(--theme-accent);
}
html[data-theme='dark']
  :is(
    .secondary,
    .top-search button,
    .ui-title-icon,
    .ui-admin-badge,
    .ui-toast-tag,
    .stat-icon,
    .ui-step span
  ) {
  background: var(--theme-info-bg);
  color: var(--theme-info);
  border-color: var(--theme-border);
}
html[data-theme='dark'] .outline {
  background: var(--theme-input);
  color: var(--theme-info);
  border-color: var(--theme-border);
}
html[data-theme='dark'] :is(.outline, .secondary):hover:not(:disabled) {
  background: var(--theme-raised);
}
html[data-theme='dark'] .danger {
  background: var(--theme-danger-bg);
  color: var(--theme-danger);
  border-color: #81515f;
}
html[data-theme='dark'] :is(.error, .login48-error) {
  color: var(--theme-danger);
}
html[data-theme='dark'] .badge {
  background: var(--theme-info-bg);
  color: var(--theme-info);
}
html[data-theme='dark'] :is(.badge.closed, .ui-badge-green) {
  background: var(--theme-success-bg);
  color: var(--theme-success);
}
html[data-theme='dark'] .badge.wait {
  background: var(--theme-warning-bg);
  color: var(--theme-warning);
}
html[data-theme='dark'] .badge.cancel {
  background: var(--theme-raised);
  color: var(--theme-muted);
}
html[data-theme='dark']
  :is(
    .ui-drop,
    .ui-asset-card,
    .ui-detail,
    .ux-account-grid,
    .ux-password-box,
    .ux-profile-identity
  ) {
  background: var(--theme-input);
  color: var(--theme-text);
  border-color: var(--theme-border);
}
html[data-theme='dark']
  :is(.ui-asset-card .asset-icon, .ux-drawer-close, .sidebar-collapse, .mobile-menu:hover) {
  background: var(--theme-raised);
  color: var(--theme-info);
  border-color: var(--theme-border);
}

/* ID selectors match the drawer's existing positioning-rule specificity. */
html[data-theme='dark'] :is(#ticketSide, #inventorySide).ui-side {
  background: var(--theme-panel);
  color: var(--theme-text);
  border-color: var(--theme-border);
}
html[data-theme='dark'] :is(#ticketSide, #inventorySide).ui-side > .ui-side-head {
  background: var(--theme-panel);
  border-color: var(--theme-border);
}
html[data-theme='dark'] .ui-side-tabs button.active {
  color: var(--theme-accent);

html[data-theme='dark'] :is(.login48-divider:before, .login48-divider:after) {
  background: var(--theme-border);

/* Palette-aware surfaces/actions override legacy feature-level color literals. */
html[data-theme] body {
  background-color: var(--theme-bg);
  color: var(--theme-text);
}
html[data-theme] :is(.card, .ui-panel, .modal-box, .topbar, .ux-notification-menu) {
  background-color: var(--theme-panel);
  color: var(--theme-text);

  background: var(--theme-action);

}

  filter: brightness(0.92);
}
html[data-theme] :is(.secondary, .outline, .ghost) {
  background-color: var(--theme-raised);
  color: var(--theme-heading);
  border-color: var(--theme-border);
}
html[data-theme] :is(.secondary, .outline, .ghost):hover:not(:disabled) {
  background-color: var(--theme-info-bg);
}
html[data-theme] :is(.link, a:not(.primary)) {
  color: var(--theme-accent);
}
html[data-theme] :is(th, .table th, .admin35-table th) {
  background-color: var(--theme-raised);

  :is(input, select, textarea):not(
