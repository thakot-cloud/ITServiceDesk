<template id="permissionAdminPanelTemplate">
  <section class="permission-admin-panel">
    <div class="permission-admin-head">
      <h2>กำหนดสิทธิ์การกระทำ</h2>
      <p>
        จัดการ Action Permission เช่น รับงาน อัปเดตสถานะ ปิดงาน ยกเลิกงาน แก้ไขทะเบียน และ Import
        ข้อมูลหลัก
      </p>
      <button
        class="outline"
        type="button"
        onclick="permissionAdminRenderActionMatrix('permissionActionMatrix')"
      >
        โหลดสิทธิ์ล่าสุด
      </button>
    </div>
    <div id="permissionActionMatrix"></div>
  </section>
</template>
