    drop.addEventListener('keydown', (event) => {
      if ((event.key === 'Enter' || event.key === ' ') && !fileInput.disabled) {
        event.preventDefault();
        fileInput.click();
      }
    });
    drop.addEventListener('dragover', (event) => {
      event.preventDefault();
      if (fileInput.disabled) return;
      drop.classList.add('dragover');
    });
    drop.addEventListener('dragleave', () => drop.classList.remove('dragover'));
    drop.addEventListener('drop', (event) => {
      event.preventDefault();
      drop.classList.remove('dragover');
      if (fileInput.disabled) return;
      const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
      if (file) processSelectedFile(file);
    });

    fileInput.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      if (file) processSelectedFile(file);
    });

    overlay.addEventListener('click', (event) => {
      if (event.target === overlay) closeModal();
    });

    document.addEventListener('keydown', handleEscape);
    overlay.querySelector('.ocpb-import-filetype-btn.csv').focus();
  }

  function handleEscape(event) {
    if (event.key === 'Escape') closeModal();
  }

  function closeModal() {
    if (state.busy || (state.modal && state.modal.querySelector('.ocpb-import-confirm-backdrop')))
      return;
    state.revision++; // invalidate in-flight callbacks
    document.removeEventListener('keydown', handleEscape);
    if (state.modal && state.modal.parentNode) {
      state.modal.parentNode.removeChild(state.modal);
    }
    state.modal = null;
  }

  function resetImportState(kind) {
    state.kind = kind;
    state.fileType = '';
    state.headers = [];
    state.rows = [];
    state.previewToken = '';
    state.previewSummary = null;
    state.fileName = '';
    state.phase = 'idle';
    state.busy = false;
    state.revision++;
  }

  function selectFileType(fileType) {
    if (!state.modal || state.busy || state.phase === 'complete' || state.phase === 'validated')
      return;
    const type = String(fileType || '').toUpperCase();
    if (type !== 'CSV' && type !== 'XLSX') return;

    state.fileType = type;
    state.headers = [];
    state.rows = [];
    state.previewToken = '';
    state.previewSummary = null;
    state.fileName = '';
    state.revision++;
    state.phase = 'select';

    state.modal.querySelectorAll('.ocpb-import-filetype-btn').forEach((btn) => {
      btn.classList.toggle('selected', btn.dataset.fileType === type);
    });

    const input = state.modal.querySelector('.ocpb-import-file');
    input.value = '';
    input.accept =
      type === 'CSV'
        ? '.csv,text/csv'
        : '.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';

    const drop = state.modal.querySelector('.ocpb-import-drop');
    const selected = state.modal.querySelector('.ocpb-import-selected-file');
    const note = state.modal.querySelector('.ocpb-import-accept-note');
    const preview = state.modal.querySelector('.ocpb-import-preview');
    const commit = state.modal.querySelector('.ocpb-import-commit');

    drop.hidden = false;
    selected.hidden = true;
    selected.textContent = '';
    note.textContent =
      'รองรับไฟล์ .' +
      type.toLowerCase() +
      ' · ขนาดไม่เกิน 10 MB · สูงสุด ' +
      MAX_ROWS +
      ' รายการ/ครั้ง';
    preview.disabled = true;
    commit.hidden = false;
    commit.disabled = true;
    hidePreview();
    setSteps(1);
    setMessage('เลือกไฟล์ ' + type + ' จากเครื่อง หรือ ลากไฟล์มาวาง', '');
  }

  async function processSelectedFile(file) {
    if (!state.modal || state.busy || state.phase === 'complete' || state.phase === 'validated')
      return;
    state.revision++;
    const revision = state.revision;
    state.previewToken = '';
    state.previewSummary = null;
    state.phase = 'reading';
    if (!state.fileType) {
      state.phase = 'select';
      setMessage('กรุณาเลือกประเภทไฟล์ CSV หรือ XLSX ก่อน', 'error');
      return;
    }

    if (file.size > MAX_FILE_BYTES) {
      state.phase = 'select';
      setMessage('ไฟล์มีขนาดเกิน 10 MB กรุณาเลือกไฟล์ที่เล็กกว่า', 'error');
      return;
    }

    const lower = String(file.name || '').toLowerCase();
    const expectedExt = state.fileType === 'CSV' ? '.csv' : '.xlsx';
    if (!lower.endsWith(expectedExt)) {
      state.phase = 'select';
      setMessage('ประเภทไฟล์ไม่ตรงกับที่เลือก กรุณาเลือกไฟล์ ' + expectedExt, 'error');
      return;
    }

    const previewBtn = state.modal.querySelector('.ocpb-import-preview');
    previewBtn.disabled = true;
    setMessage('กำลังอ่านไฟล์...', '');

    try {
      const parsed = await parseImportFile(file);
      if (!state.modal || revision !== state.revision) return;
      if (!parsed.headers.length) throw new Error('ไม่พบ Header ในไฟล์');
      if (!parsed.rows.length) throw new Error('ไม่พบข้อมูลในไฟล์');
      if (parsed.rows.length > MAX_ROWS) {
        throw new Error(
          'ไฟล์มี ' + parsed.rows.length + ' รายการ เกินสูงสุด ' + MAX_ROWS + ' รายการ/ครั้ง',
        );
      }

      state.headers = parsed.headers;
      state.rows = parsed.rows;
      state.fileName = file.name;
      state.previewToken = '';
      state.previewSummary = null;

      const selected = state.modal.querySelector('.ocpb-import-selected-file');
      selected.hidden = false;
      selected.textContent =
        'ไฟล์: ' +
        file.name +
        ' · ' +
        parsed.rows.length +
        ' รายการ · ' +
        (file.size / 1024).toFixed(1) +
        ' KB';

      state.phase = 'ready';
      previewBtn.disabled = false;
      renderRawPreview(parsed.headers, parsed.rows.slice(0, 8));
      setSteps(1);
      setMessage('อ่านไฟล์แล้ว ' + parsed.rows.length + ' รายการ · กด “ตรวจสอบข้อมูล”', 'success');
    } catch (err) {
      if (!state.modal || revision !== state.revision) return;
      state.phase = 'select';
      state.headers = [];
      state.rows = [];
      previewBtn.disabled = true;
      hidePreview();
      setMessage(errorMessage(err), 'error');
    }
  }

  async function parseImportFile(file) {
    if (state.fileType === 'CSV') {
      const text = await file.text();
      return matrixToImport(parseCsv(text));
    }

    if (state.fileType === 'XLSX') {
      await ensureXlsx();
      const buffer = await file.arrayBuffer();
      const workbook = window.XLSX.read(buffer, { type: 'array', cellDates: true });
      if (!workbook.SheetNames.length) throw new Error('Workbook ไม่มี Sheet');
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const matrix = window.XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: '',
        raw: false,
        dateNF: 'dd/mm/yyyy hh:mm',
      });
      return matrixToImport(matrix);
    }

    throw new Error('กรุณาเลือกประเภทไฟล์ CSV หรือ XLSX');
  }

  function matrixToImport(matrix) {
    const clean = Array.isArray(matrix) ? matrix : [];
    const headerRow = clean.shift() || [];
    const headers = headerRow.map((value) =>
      normalizeText(String(value || '').replace(/^\uFEFF/, '')),
    );
    const rows = clean
      .map((row) =>
        Array.isArray(row) ? row.map((value) => (value == null ? '' : String(value))) : [],
      )
      .filter((row) => row.some((value) => normalizeText(value) !== ''));

    return { headers, rows };
  }

  function parseCsv(text) {
    const input = String(text || '').replace(/^\uFEFF/, '');
    const rows = [];
    let row = [];
    let value = '';
    let quoted = false;

    for (let i = 0; i < input.length; i++) {
      const ch = input[i];
      if (quoted) {
        if (ch === '"') {
          if (input[i + 1] === '"') {
            value += '"';
            i++;
          } else {
            quoted = false;
          }
        } else {
          value += ch;
        }
      } else {
        if (ch === '"') {
          quoted = true;
        } else if (ch === ',') {
          row.push(value);
          value = '';
        } else if (ch === '\n') {
          row.push(value.replace(/\r$/, ''));
          rows.push(row);
          row = [];
          value = '';
        } else {
          value += ch;
        }
      }
    }

    if (quoted) throw new Error('CSV มีเครื่องหมาย " ไม่ครบคู่');
    if (value !== '' || row.length) {
      row.push(value.replace(/\r$/, ''));
      rows.push(row);
    }
    return rows;
  }

  function ensureXlsx() {
    if (window.XLSX && window.XLSX.read) return Promise.resolve();

    return new Promise((resolve, reject) => {
      const existing = document.querySelector('script[data-ocpb-xlsx-loader]');
      if (existing) {
        existing.addEventListener('load', resolve, { once: true });
        existing.addEventListener('error', () => reject(new Error('โหลด XLSX Library ไม่สำเร็จ')), {
          once: true,
        });
        return;
      }

      const script = document.createElement('script');
      script.dataset.ocpbXlsxLoader = '1';
      script.src = 'https:\/\/cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      script.async = true;
      script.onload = () => resolve();
      script.onerror = () =>
        reject(new Error('โหลด XLSX Library ไม่สำเร็จ ตรวจสอบ Internet/Content Policy'));
      document.head.appendChild(script);
    });
  }

  function runPreview() {
    if (state.busy || state.phase !== 'ready' || !state.headers.length || !state.rows.length)
      return;
    const revision = ++state.revision;

    const authToken = getAuthToken();
    if (!authToken) {
      setMessage('ไม่พบ Session Token กรุณา Logout/Login ใหม่ แล้วลองอีกครั้ง', 'error');
      return;
    }

    setBusy(true, 'กำลังตรวจสอบข้อมูล...');
    setSteps(2);

    google.script.run
      .withSuccessHandler((result) => {
        if (!state.modal || revision !== state.revision) return;
        setBusy(false);

        // Backward-compatible response validation:
        // Older ImportService returns {summary, previewToken, version, ...}
        // without a `success` property. Treat only an explicit success=false,
        // a missing result, or a missing summary as validation failure.
        if (!result || result.success === false || !result.summary) {
          setMessage('ตรวจสอบข้อมูลไม่สำเร็จ', 'error');
          return;
        }

        state.previewToken = result.previewToken || '';
        state.phase =
          Number(result.summary.ready) > 0 && !!state.previewToken ? 'validated' : 'ready';
        state.previewSummary = result.summary || null;
        renderValidatedPreview(result);
        setSteps(2);

        const commit = state.modal.querySelector('.ocpb-import-commit');
        commit.hidden = false;
        commit.disabled = state.phase !== 'validated' || !state.previewToken;
        updateControls();

        if (result.summary && result.summary.errors > 0) {
          setMessage(
            'พบข้อมูลผิดพลาด กรุณาแก้ไฟล์ก่อน Import รายการที่ผิดพลาดจะไม่ถูกบันทึก',
            'error',
          );
        } else if (result.summary && result.summary.ready > 0) {
          setMessage('Validation ผ่าน พร้อม Import ' + result.summary.ready + ' รายการ', 'success');
        } else {
          setMessage('ไม่มีรายการใหม่ที่พร้อม Import', '');
        }
      })
      .withFailureHandler((err) => {
        if (!state.modal || revision !== state.revision) return;
        state.phase = 'ready';
        setBusy(false);
        setMessage(errorMessage(err), 'error');
      })
      .ocpbImportPreview({
        kind: state.kind,
        headers: state.headers,
        rows: state.rows,
        authToken: authToken,
      });
  }

  async function runCommit() {
    if (state.busy || state.phase !== 'validated' || !state.previewToken) return;
    const ready = Number((state.previewSummary && state.previewSummary.ready) || 0);
    if (!ready) return;
    const revision = state.revision;
    const confirmed = await showImportConfirmation(
      'ยืนยัน Import ' + ready + ' รายการเข้าสู่ระบบจริง?',
      'รายการซ้ำจะถูกข้าม และข้อมูลเดิมจะไม่ถูกเขียนทับ',
    );
    if (!confirmed || !state.modal || revision !== state.revision || state.phase !== 'validated')
      return;

    const authToken = getAuthToken();
    if (!authToken) {
      setMessage('Session หาย กรุณา Login ใหม่', 'error');
      return;
    }
    state.phase = 'importing';
    setBusy(true, 'กำลัง Import...');
    setSteps(3);

    google.script.run
      .withSuccessHandler((result) => {
        if (!state.modal || revision !== state.revision) return;
        setBusy(false);
        if (!result || result.success === false) {
          state.phase = 'validated';
          updateControls(); // recover buttons after a server-side rejection
          setMessage('Import ไม่สำเร็จ กรุณาตรวจสอบและลองใหม่', 'error');
          return;
        }
        setSteps(4);
        const imported = Number((result && result.imported) || 0);
        const skipped = Number((result && result.skipped) || 0);
        const errors = Number((result && result.errors) || 0);
        state.phase = 'complete';
        state.previewToken = '';
        state.previewSummary = null;
        setMessage(
          'ผลการ Import: สำเร็จ ' + imported + ' รายการ · ข้าม ' + skipped + ' · ผิดพลาด ' + errors,
          errors ? 'error' : 'success',
        );
        updateControls();
      })
      .withFailureHandler((err) => {
        if (!state.modal || revision !== state.revision) return;
        state.phase = 'validated';
        setBusy(false); // updateControls unlocks a valid retry
        setMessage(errorMessage(err), 'error');
      })
      .ocpbImportCommit({
        kind: state.kind,
        headers: state.headers,
        rows: state.rows,
        authToken: authToken,
        previewToken: state.previewToken,
      });
  }

  function showImportConfirmation(title, description) {
    return new Promise((resolve) => {
      if (!state.modal) return resolve(false);
      const root = document.createElement('div');
      root.className = 'ocpb-import-confirm-backdrop';
      root.setAttribute('role', 'presentation');
      const card = document.createElement('div');
      card.className = 'ocpb-import-confirm-card';
      card.setAttribute('tabindex', '-1');
      card.setAttribute('role', 'alertdialog');
      card.setAttribute('aria-modal', 'true');
      const heading = document.createElement('h3');
      heading.textContent = title;
      const note = document.createElement('p');
      note.textContent = description;
      const actions = document.createElement('div');
      actions.className = 'ocpb-import-actions';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'ocpb-import-action ocpb-import-secondary';
      cancel.textContent = 'ยกเลิก';
      const confirm = document.createElement('button');
      confirm.type = 'button';
      confirm.className = 'ocpb-import-action ocpb-import-primary';
      confirm.textContent = 'ยืนยัน Import';
      actions.append(cancel, confirm);
      card.append(heading, note, actions);
      root.append(card);
      state.modal.append(root);
      let settled = false;
      const finish = (value) => {
        if (settled) return;
        settled = true;
        root.remove();
        resolve(value);
      };
      cancel.addEventListener('click', () => finish(false));
      confirm.addEventListener('click', () => finish(true));
      root.addEventListener('click', (e) => {
        if (e.target === root) finish(false);
      });
      confirm.focus();
    });
  }

  function updateControls() {
    if (!state.modal) return;
    const modal = state.modal;
    const complete = state.phase === 'complete';
    const locked =
      state.busy || state.phase === 'validated' || state.phase === 'importing' || complete;
    const preview = modal.querySelector('.ocpb-import-preview');
    const commit = modal.querySelector('.ocpb-import-commit');
    const file = modal.querySelector('.ocpb-import-file');
    const drop = modal.querySelector('.ocpb-import-drop');
    const cancel = modal.querySelector('.ocpb-import-cancel');
    preview.hidden = complete;
    preview.disabled = locked || state.phase !== 'ready';
    commit.hidden = complete;
    commit.disabled = state.busy || state.phase !== 'validated' || !state.previewToken;
    if (file) file.disabled = locked;
    if (drop) {
      drop.hidden = complete || !state.fileType;
      drop.setAttribute('aria-disabled', String(locked));
    }
    modal.querySelectorAll('.ocpb-import-filetype-btn').forEach((btn) => {
      btn.disabled = locked;
    });
    const types = modal.querySelector('.ocpb-import-filetypes');
    const typeLabel = modal.querySelector('.ocpb-import-type-label');
    if (types) types.hidden = complete;
    if (typeLabel) typeLabel.hidden = complete;
    const selected = modal.querySelector('.ocpb-import-selected-file');
    if (complete && selected) selected.hidden = true;
    if (complete) {
      modal.querySelector('.ocpb-import-summary').hidden = true;
      modal.querySelector('.ocpb-import-table-wrap').hidden = true;
      cancel.textContent = 'ปิด';
      cancel.classList.remove('ocpb-import-secondary');
      cancel.classList.add('ocpb-import-danger');
      modal.querySelector('.ocpb-import-close').hidden = true;
    }
  }

  function renderRawPreview(headers, rows) {
    const wrap = state.modal.querySelector('.ocpb-import-table-wrap');
    wrap.hidden = false;
    wrap.replaceChildren();

    const table = document.createElement('table');
    table.className = 'ocpb-import-table';
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');

    headers.forEach((header) => {
      const th = document.createElement('th');
      th.textContent = header;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    rows.forEach((row) => {
      const tr = document.createElement('tr');
      headers.forEach((_, i) => {
        const td = document.createElement('td');
        td.textContent = row[i] == null ? '' : String(row[i]);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function renderValidatedPreview(result) {
    const summary = state.modal.querySelector('.ocpb-import-summary');
    summary.hidden = false;
    summary.innerHTML = '';

    const values = [
      ['ทั้งหมด', result.summary.total],
      ['พร้อม Import', result.summary.ready],
      ['ข้ามซ้ำ', result.summary.skipped],
      ['ผิดพลาด', result.summary.errors],
    ];
    values.forEach((item) => {
      const box = document.createElement('div');
      box.className = 'ocpb-import-kpi';
      const strong = document.createElement('strong');
      strong.textContent = item[1];
      const small = document.createElement('small');
      small.textContent = item[0];
      box.append(strong, small);
      summary.appendChild(box);
    });

    const wrap = state.modal.querySelector('.ocpb-import-table-wrap');
    wrap.hidden = false;
    wrap.replaceChildren();

    const table = document.createElement('table');
    table.className = 'ocpb-import-table';
    const thead = document.createElement('thead');
    const trh = document.createElement('tr');
    ['แถว', 'สถานะ', 'Key', 'รายละเอียด'].forEach((label) => {
      const th = document.createElement('th');
      th.textContent = label;
      trh.appendChild(th);
    });
    thead.appendChild(trh);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    (result.preview || []).forEach((item) => {
      const tr = document.createElement('tr');
      const details = [].concat(item.errors || []).concat(item.duplicateReasons || []);

      const statusClass =
        item.status === 'READY' ? 'ready' : item.status === 'SKIP_DUPLICATE' ? 'skip' : 'error';
      const statusText =
        item.status === 'READY'
          ? 'พร้อม'
          : item.status === 'SKIP_DUPLICATE'
            ? 'ข้ามซ้ำ'
            : 'ผิดพลาด';

      [item.row, statusText, item.key || '-', details.join(' · ') || '-'].forEach(
        (value, index) => {
          const td = document.createElement('td');
          td.textContent = String(value);
          if (index === 1) td.className = 'ocpb-import-status ' + statusClass;
          if (index === 3) td.classList.add('ocpb-import-errors');
          tr.appendChild(td);
        },
      );
      tbody.appendChild(tr);
    });

    table.appendChild(tbody);
    wrap.appendChild(table);
  }

  function hidePreview() {
    if (!state.modal) return;
    const summary = state.modal.querySelector('.ocpb-import-summary');
    const wrap = state.modal.querySelector('.ocpb-import-table-wrap');
    summary.hidden = true;
    wrap.hidden = true;
    summary.replaceChildren();
    wrap.replaceChildren();
  }

  function setBusy(isBusy, message) {
    if (!state.modal) return;
    state.busy = !!isBusy;
    updateControls();
    if (message) setMessage(message, '');
  }

  function setMessage(message, type) {
    if (!state.modal) return;
    const el = state.modal.querySelector('.ocpb-import-message');
    el.className = 'ocpb-import-message' + (type ? ' ' + type : '');
    el.textContent = String(message || '');
  }

  function setSteps(index) {
    if (!state.modal) return;
    const steps = Array.from(state.modal.querySelectorAll('.ocpb-import-step span'));
    steps.forEach((step, i) => step.classList.toggle('active', i <= index));
  }

  function errorMessage(err) {
    const raw = String((err && err.message) || err || '')
      .replace(/^Exception:\s*/i, '')
      .trim();
    if (!raw) return 'เกิดข้อผิดพลาด';
    if (
      raw.length > 260 ||
      /SpreadsheetApp|DriveApp|openById|getRange|Service invoked|Internal error|ReferenceError|TypeError|SyntaxError|stack|ระบบฐานข้อมูลไม่พร้อมใช้งาน/i.test(
        raw,
      )
    ) {
      return 'ระบบไม่สามารถดำเนินการนำเข้าได้ กรุณาลองใหม่อีกครั้งหรือติดต่อผู้ดูแลระบบ';
    }
    return raw;
  }

  function escapeHtml(value) {
    return String(value || '').replace(
      /[&<>"']/g,
      (ch) =>
        ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;',
        })[ch],
    );
  }
})();


// apps/webapp/src/client/app/shell-integration.js
const ux5 = {
  /* Desktop sidebar: auto-collapsed by default, temporarily expands on hover.
     The arrow button is kept as an optional pin/unpin control. */
  sidebarPinned: uiReadPreference('ocpb_sidebar_pinned') === '1',
  sidebarHover: false,
  notificationOpen: false,
  drawer: '',
};

const ux5TicketSideBase = uiTicketSide;

uiTicketSide = async function (id) {

(function () {

  function canManageActionRights() {
    return (
      typeof state !== 'undefined' &&

      '<div class="table-wrap"><table class="table permission-action-table"><thead><tr><th>Role</th><th>Module</th><th>Action</th><th>ชื่อสิทธิ์</th><th>Scope</th><th>เปิดใช้</th><th>หมายเหตุ</th></tr></thead><tbody>' +

          const protectedRight =
            r.role_key === 'ADMIN' && ['role.manage', 'permission.update'].includes(r.action_key);
          return (
            '<tr><td>' +
            esc(r.role_key) +
            '</td><td>' +
            esc(r.module_key) +
            '</td><td><code>' +
            esc(r.action_key) +
            '</code></td><td>' +
            esc(r.action_name) +
            '</td><td>' +
            esc(r.scope_rule) +
            '</td><td><label class="switch-mini" title="' +

            '"><input type="checkbox" ' +
            (r.is_allowed || protectedRight ? 'checked' : '') +
            ' ' +
            (protectedRight ? 'disabled' : '') +
            ' onchange="permissionAdminToggleAction(\'' +
            escAttr(r.permission_id) +
            '\',this.checked)"><span></span></label></td><td>' +
            esc(r.note || '') +
            '</td></tr>'
          );
        })
        .join('') +
      '</tbody></table></div>'
    );
  }
  window.permissionAdminRenderActionMatrix = async function (targetId) {
    const target = document.getElementById(targetId || 'permissionActionMatrix');
    if (!target) return;
    if (!canManageActionRights()) {
      target.textContent = 'ไม่มีสิทธิ์จัดการสิทธิ์การกระทำ';

    );

})();

  const entries = (PM_UI.calendar_entries || []).filter(x => x.active && x.start_date <= key && x.end_date >= key);
  const holiday = entries.some(x => ['HOLIDAY','SPECIAL_HOLIDAY'].includes(x.kind));
  return {className:holiday ? 'pm122-holiday' : [0,6].includes(weekday) ? 'pm122-weekend' : '',
    markup:entries.map(x => `<div class="pm122-day-note ${x.kind === 'ANNOUNCEMENT' ? 'pm122-announcement' : ''}" title="${escAttr(x.notes || x.title)}">${esc(x.title)}</div>`).join('')};
}

pmDraw = function () {
  const host = $('pmGrid');
  if (!host) return;
  const [year, month] = PM_UI.month.split('-').map(Number),
    offset = new Date(Date.UTC(year, month - 1, 1)).getUTCDay(),
    last = new Date(Date.UTC(year, month, 0)).getUTCDate();
  let html = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์']
    .map((n) => `<div class="pm-week">${n}</div>`)
    .join('');
  for (let i = 0; i < Math.ceil((offset + last) / 7) * 7; i++) {
    const day = i - offset + 1,
      key = PM_UI.month + '-' + String(day).padStart(2, '0');
    if (day < 1 || day > last) {
      html += '<div class="pm-day pm-out"></div>';
      continue;
    }
    const cards = PM_UI.items.filter(
      (p) => p.plan_date <= key && (p.end_date || p.plan_date) >= key,
    );
    const dayInfo = calendar122DayInfo(key, i % 7);
    html += `<div class="pm-day ${dayInfo.className}" data-pm-date="${key}" ondragover="event.preventDefault()" ondrop="pmDrop(event,'${key}')"><div class="pm-day-head"><b>${day}</b>${pmCanManage() ? `<button type="button" title="สร้างแผน" onclick="pmForm(null,'${key}')">+</button>` : ''}</div>${dayInfo.markup}${cards.map((p) => `<button type="button" class="pm-event pm-${PMPL_STATES.indexOf(p.status)}" draggable="${pmCanManage() && p.plan_date === key}" data-plan-id="${esc(p.plan_id)}" ondragstart="pmDrag(event,this.dataset.planId)" onclick="pmForm(this.dataset.planId)" title="${esc(p.description)} · ${esc(p.plan_date)} ถึง ${esc(p.end_date || p.plan_date)}"><strong>${esc(p.org_name)}</strong><small>${p.plan_date === key ? esc(p.start_time) : 'ต่อเนื่อง'} · ${esc(p.work_area || p.status)}</small>${p.owner_name ? `<small>${esc(p.owner_name)}</small>` : ''}</button>`).join('')}</div>`;
  }
  host.innerHTML = html;
};

const pmplFormBase = pmForm;

pmForm = function (id = null, date = '') {
  const item = PM_UI.items.find((p) => p.plan_id === id) || {};
  if (!pmCanManage()) {
    const details = [
      ['ชุดแผน', item.planning_name || 'งาน PM เดิม'],
      ['งาน', item.description],
      ['หน่วยงาน', item.org_name],
      ['พื้นที่', item.work_area || '—'],
      ['ช่วงวัน', pmplDate(item.plan_date) + ' – ' + pmplDate(item.end_date || item.plan_date)],
      ['เวลา', item.start_time + ' – ' + item.end_time],
      ['ผู้รับผิดชอบ', item.owner_name || 'ยังไม่ระบุ'],
      ['สถานะ', item.status],
      ['ความเร่งด่วน', item.priority || 'ปกติ'],
      ['ความคืบหน้า', (Number(item.progress) || 0) + '%'],
    ];
    return openModal(
      'รายละเอียดแผน PM',
      `<div class="ui-detail">${details.map(([key, value]) => `<b>${esc(key)}</b><span>${esc(value)}</span>`).join('')}</div>`,
    );
  }
  pmplFormBase(id, date);
  const form = $('modalBody').querySelector('form'),
    start = item.plan_date || date || PM_UI.month + '-01';
  form.removeAttribute('onsubmit');
  form.addEventListener('submit', (event) =>
    pmSubmit(event, item.plan_id || '', Number(item.revision) || 0),
  );
  form.querySelectorAll('button[onclick]').forEach((button) => {
    const action = button.getAttribute('onclick');
    if (action.startsWith('pmRequestSoftDelete')) {
      button.removeAttribute('onclick');
      button.addEventListener('click', () =>
        pmRequestSoftDelete(item.plan_id, Number(item.revision)),
      );
    } else if (action.startsWith('pmCancel')) {
      button.removeAttribute('onclick');
      button.addEventListener('click', () => pmCancel(item.plan_id, Number(item.revision)));
    }
  });
  if (!PM_UI.ready) return;
  const extra = `<div class="form-grid pmpl-extra"><label>วันสิ้นสุด *<input id="pmEndDate" type="date" required value="${esc(item.end_date || start)}"></label><label>ผู้รับผิดชอบ<select id="pmOwner"><option value="">ยังไม่ระบุ</option>${pmplOptions(PM_UI.owners || [], item.owner_id)}</select></label><label>ชุด Planning<select id="pmPlanning"><option value="">ไม่อยู่ในชุด Planning</option>${pmplOptions(PM_UI.groups || [], item.planning_id, 'planning_id', 'name')}</select></label><label>ความเร่งด่วน<select id="pmPriority">${PMPL_PRIORITIES.map((s) => `<option ${s === (item.priority || 'ปกติ') ? 'selected' : ''}>${s}</option>`).join('')}</select></label><label>ความคืบหน้าที่รายงาน (%)<input id="pmProgress" type="number" min="0" max="100" step="1" value="${Number(item.progress) || 0}"><small class="hint">งานเสร็จคิดเป็น 100% ตามสถานะ</small></label></div>`;
  form.querySelector('.form-grid').insertAdjacentHTML('afterend', extra);
  const sync = () => pmplProgressInput($('pmState'), $('pmProgress'));
  $('pmState').addEventListener('change', sync);
  sync();
  $('pmDate').addEventListener('change', () => {
    if ($('pmEndDate').value < $('pmDate').value) $('pmEndDate').value = $('pmDate').value;
  });
};

pmSubmit = async function (event, id, revision) {
  event.preventDefault();
  const form = event.target;
  if (form.dataset.saving) return;
  form.dataset.saving = '1';
  const payload = {
    plan_id: id,
    revision,
    plan_date: uiValue('pmDate'),
    org_unit_id: uiValue('pmOrg'),
    work_area: uiValue('pmArea'),
    start_time: uiValue('pmStart'),
    end_time: uiValue('pmEnd'),
    status: uiValue('pmState'),
    description: uiValue('pmDescription'),
  };
  if ($('pmEndDate'))
    Object.assign(payload, {
      end_date: uiValue('pmEndDate'),
      owner_id: uiValue('pmOwner'),
      planning_id: uiValue('pmPlanning'),
      priority: uiValue('pmPriority'),
      progress: Number(uiValue('pmProgress')),
    });
  const controls = [...form.querySelectorAll('button')];
  controls.forEach((b) => (b.disabled = true));
  try {
    await call('pmSavePlan', token, payload);
    closeModal();
    PM_UI.month = payload.plan_date.slice(0, 7);
    if (PM_UI.view === 'planning') await pmplLoad();
    else pmCalendarPage();
    toast('บันทึกแผน PM แล้ว');
  } catch (e) {
    fail(e);
  } finally {
    delete form.dataset.saving;
    controls.forEach((b) => (b.disabled = false));
  }
};

              if ((item.missing || []).length) card.appendChild(el('p', 'line78-card-warning', 'ข้อมูลไม่ครบ: ' + item.missing.join(' / ')));
              else card.appendChild(el('p', 'line78-card-ready', item.review ? 'ตรวจสอบข้อมูลแล้ว พร้อมอนุมัติ' : 'ข้อมูลพร้อมตรวจสอบ'));
              var actions = el('div', 'itsd65-actions');
              var editable = ['PENDING_REVIEW','IN_REVIEW','APPROVED','FAILED'].includes(item.status);
              if (line78Can('review')) actions.appendChild(btn('ตรวจสอบ / แก้ไขข้อมูล', 'outline', function() { line78Edit(item, refresh); }, !editable));
              if (line78Can('approve')) actions.appendChild(btn('อนุมัติแจ้งซ่อม', 'primary', function() { line78Decision(item, 'APPROVE', refresh); }, !editable || ((item.missing || []).length > 0 && !line78Can('review'))));
              if (line78Can('reject')) actions.appendChild(btn('ปฏิเสธแจ้งซ่อม', 'danger', function() { line78Decision(item, 'REJECT', refresh); }, !editable));
              card.appendChild(actions);
              body.appendChild(card);
            });
          }
        })
        .catch(function (e) {
          if (panel.isConnected) {
            body.replaceChildren();
            body.appendChild(
              el('div', 'itsd65-error', 'โหลดข้อมูล LINE ไม่สำเร็จ: ' + line78Message(e)),
            );
          }
        });
    }
    refresh();
  }
  var queued = false;
  function schedule() {
    if (queued) return;
    queued = true;
    setTimeout(function () {
      queued = false;
      renderArea('SETTINGS');
      renderArea('INBOX');
    }, 0);
  }
  document.addEventListener('DOMContentLoaded', function () {
    var host = document.getElementById('content');
    if (!host) return;
    new MutationObserver(schedule).observe(host, { childList: true, subtree: false });
    schedule();
  });
})();

window.itsd70SettingsMounted = true;

const project70UI = { data: null, loading: null, tab: 'general' };

itsd65ShowSettingsTab = project70SelectTab;

(function () {
  const prior = admin35SettingsRender;
  admin35SettingsRender = function () {
    const selected = project70UI.tab;
    prior();
    if (state?.user?.role !== 'ADMIN') {
      const tab = $('itsdTabLine');
      if (tab) tab.hidden = true;
      project70SelectTab('general');
      return;
    }
    const section = $('itsdSettingsGeneral')?.parentElement,
      tabs = section?.querySelector('[role=tablist]');
    if (!section || !tabs) return;
    for (const [key, label] of [
      ['Project', 'โครงการ / การเชื่อมต่อ'],
      ['Holidays', 'จัดการวันหยุด'],
      ['Report', 'แม่แบบใบงาน'],
      ['Password', 'เปลี่ยนรหัสผ่าน NIST'],
    ]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.id = 'itsdTab' + key;
      button.setAttribute('role', 'tab');
      button.setAttribute('aria-controls', 'itsdSettings' + key);
      button.textContent = label;
      button.onclick = () => project70SelectTab(key.toLowerCase());
      tabs.appendChild(button);
      const panel = document.createElement('div');
      panel.id = 'itsdSettings' + key;
      panel.setAttribute('role', 'tabpanel');
      panel.hidden = true;
      panel.className = 'admin39-panel project70';
      panel.innerHTML = `<div id="project70${key}Mount">กำลังโหลดการตั้งค่า...</div>`;
      section.appendChild(panel);
    }
    const line = $('itsdSettingsLine');
    line.className = 'admin39-panel project70';
    line.innerHTML = '<div id="project70LineMount">กำลังโหลดการตั้งค่า...</div>';
    for (const suffix of ['General', 'Line', 'Project', 'Holidays', 'Report', 'Password']) {
      const tab = $('itsdTab' + suffix),
        panel = $('itsdSettings' + suffix);
      if (tab && panel) panel.setAttribute('aria-labelledby', tab.id);
    }
    tabs.onkeydown = (event) => {
      const buttons = Array.from(tabs.querySelectorAll('[role=tab]')),
        i = buttons.indexOf(document.activeElement);
      if (i < 0) return;
      let n = i;
      if (event.key === 'ArrowRight') n = (i + 1) % buttons.length;
      else if (event.key === 'ArrowLeft') n = (i + buttons.length - 1) % buttons.length;
      else if (event.key === 'Home') n = 0;
      else if (event.key === 'End') n = buttons.length - 1;
      else return;
      event.preventDefault();
      project70SelectTab(['general', 'line', 'project', 'holidays', 'report', 'password'][n], true);
    };
    // The root folder was previously hidden, making manual configuration impossible.
    const root = $('a35ServiceFolder');
    if (root && root.type === 'hidden') {
      root.type = 'text';
      const label = document.createElement('label');
      label.textContent = 'Google Drive Root Folder';
      root.replaceWith(label);
      label.appendChild(root);
      section.querySelector('.admin39-form-grid')?.prepend(label);
    }
    project70SelectTab(selected);
    const epoch = uiViewEpoch;
    if (!project70UI.loading)
      project70UI.loading = call('getProjectConfiguration', token).finally(
        () => (project70UI.loading = null),
      );
    project70UI.loading
      .then((data) => {
        if (epoch !== uiViewEpoch || page !== 'settings') return;
        project70UI.data = data;
        project70Render();
      })
      .catch((e) => {
        if (epoch === uiViewEpoch && page === 'settings')
          for (const id of ['project70ProjectMount', 'project70LineMount', 'project70ReportMount'])
            if ($(id)) $(id).textContent = 'โหลดการตั้งค่าไม่ได้: ' + e.message;
      });
  };
})();
