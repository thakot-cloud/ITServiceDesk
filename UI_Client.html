    if (page === 'users') fail(e);
  }
}

function admin36RoleMeta(code) {
  const map = {
    ADMIN: { icon: 'shield_person', label: 'ผู้ดูแลระบบ', tone: 'red' },
    MANAGER: { icon: 'groups', label: 'ผู้จัดการ', tone: 'orange' },
    TECHNICIAN: { icon: 'support_agent', label: 'เจ้าหน้าที่ IT', tone: 'purple' },
    ITSUPPORT: { icon: 'support_agent', label: 'ฝ่ายสนับสนุน IT', tone: 'purple' },
    USER: { icon: 'person', label: 'ผู้ใช้งานทั่วไป', tone: 'blue' },
  };
  return (
    map[String(code || 'USER').toUpperCase()] || {
      icon: 'person',
      label: String(code || 'USER'),
      tone: 'blue',
    }
  );
}

function admin36UserRights(role) {
  const map = {
    ADMIN: [
      'จัดการผู้ใช้และกำหนดสิทธิ์',
      'จัดการข้อมูลหลัก',
      'จัดการคำร้องทั้งหมด',
      'ดูรายงานและสถิติ',
      'ตั้งค่าระบบ',
    ],
    MANAGER: [
      'จัดการงานและดูแลทีม',
      'ติดตามรายการแจ้งซ่อม',
      'ดูรายงานและสถิติ',
      'ดูประวัติการใช้งาน',
    ],
    TECHNICIAN: ['จัดการงานแจ้งซ่อม', 'อัปเดตสถานะงาน', 'ดูข้อมูลอุปกรณ์/ครุภัณฑ์'],
    ITSUPPORT: ['จัดการงานแจ้งซ่อม', 'อัปเดตสถานะงาน', 'ดูข้อมูลอุปกรณ์/ครุภัณฑ์'],
    USER: ['แจ้งซ่อมใหม่', 'ติดตามสถานะงานของตนเอง', 'ดูประกาศของระบบ'],
  };
  return map[String(role || 'USER').toUpperCase()] || ['สิทธิ์ตามบทบาทที่กำหนด'];
}

function admin36UserDept(u) {
  return u.department_name || u.org_unit_name || admin35OrgName(u.org_unit_id) || '—';
}

function admin36RoleBadge(role) {
  const m = admin36RoleMeta(role);
  return `<span class="admin36-role-pill role-${String(role || 'USER').toLowerCase()}">${esc(m.label)}</span>`;
}

function admin122CompareUsers(a, b) {
  const order = ['ADMIN','MANAGER','TECHNICIAN','ITSUPPORT','USER'];
  const rank = u => { const i = order.indexOf(String(u.role || '').toUpperCase()); return i < 0 ? order.length : i; };
  return rank(a) - rank(b) || String(a.display_name || a.username || '').localeCompare(String(b.display_name || b.username || ''), 'th') || String(a.username || '').localeCompare(String(b.username || '')) || String(a.user_id || '').localeCompare(String(b.user_id || ''));
}

function admin36UserFiltered() {
  const d = admin35.users || { users: [] },
    q = String($('admin35UserQ')?.value || '').toLowerCase(),
    dept = $('admin35UserDept')?.value || '',
    role = $('admin35UserRole')?.value || '',
    status = $('admin35UserStatus')?.value || '';
  return (d.users || []).filter(
    (u) =>
      (!q ||
        [
          u.user_id,
          u.username,
          u.display_name,
          u.email,
          u.telephone,
          u.position,
          u.department_name,
          u.org_unit_name,
        ].some((v) =>
          String(v || '')
            .toLowerCase()
            .includes(q),
        )) &&
      (!dept || admin36UserDept(u) === dept) &&
      (!role || u.role === role) &&
      (!status ||
        (status === 'active'
          ? u.active && !u.locked
          : status === 'inactive'
            ? !u.active
            : status === 'locked'
              ? u.locked
              : true)),
  ).sort(admin122CompareUsers);
}

    users = d.users || [],

    admins = users.filter((x) => x.role === 'ADMIN').length,
    tech = users.filter((x) => ['TECHNICIAN', 'ITSUPPORT'].includes(x.role)).length;
  const departments = Array.from(
    new Set(users.map(admin36UserDept).filter((x) => x && x !== '—')),
  ).sort((a, b) => a.localeCompare(b, 'th'));
  $('content').innerHTML =
    `<section class="admin35 admin36-users">${admin35Header('group', 'จัดการผู้ใช้', 'จัดการบัญชีผู้ใช้งานในระบบอย่างปลอดภัย โดยไม่ส่งผลกระทบต่อการใช้งานหน้าอื่นๆ')}
  <div class="admin36-user-kpis">
    ${admin36UserKpi('ผู้ใช้ทั้งหมด', users.length, 'บัญชีผู้ใช้งาน', 'groups', 'blue')}
    ${admin36UserKpi('ผู้ดูแลระบบ', admins, 'บัญชี', 'shield', 'red')}
    ${admin36UserKpi('เจ้าหน้าที่ IT', tech, 'บัญชี', 'support_agent', 'purple')}
    ${admin36UserKpi('ใช้งานอยู่', active, 'บัญชี', 'circle', 'green')}
  </div>
  <div class="admin36-user-toolbar">
    <div class="admin36-search"><span class="material-symbols-rounded">search</span><input id="admin35UserQ" placeholder="ค้นหาชื่อ, รหัสผู้ใช้, อีเมล..." oninput="admin36UserFilterChanged()"></div>
    <select id="admin35UserDept" onchange="admin36UserFilterChanged()"><option value="">ทุกแผนก</option>${departments.map((x) => `<option value="${escAttr(x)}">${esc(x)}</option>`).join('')}</select>

    <select id="admin35UserStatus" onchange="admin36UserFilterChanged()"><option value="">ทุกสถานะ</option><option value="active">ใช้งานอยู่</option><option value="inactive">ระงับการใช้งาน</option><option value="locked">ถูกล็อก</option></select>
    <div class="admin36-toolbar-actions">${d.can_create ? '<button class="primary admin36-btn-primary" onclick="admin35UserForm()"><span class="material-symbols-rounded">add</span> เพิ่มผู้ใช้</button>' : ''}${d.can_manage ? '<button class="outline admin36-btn-outline" onclick="admin36ResetSelectedPassword()"><span class="material-symbols-rounded">key</span> รีเซ็ตรหัสผ่าน</button>' : ''}${d.can_export ? '<button class="outline admin36-btn-outline" onclick="admin36ExportUsers()"><span class="material-symbols-rounded">download</span> ส่งออก</button>' : ''}</div>
  </div>
  <div class="admin36-user-shell"><div id="admin35UserRows" class="admin36-user-list"></div><aside id="admin36UserDetail" class="admin36-user-detail"></aside></div>
  </section>`;
  admin35FilterUsers();
}

function admin36UserKpi(label, value, unit, icon, tone) {
  return `<article class="admin36-user-kpi tone-${tone}"><span class="admin36-kpi-icon"><span class="material-symbols-rounded">${icon}</span></span><div><b>${esc(label)}</b><div class="admin36-kpi-number">${esc(value)} <small>${esc(unit)}</small></div></div><span class="admin36-kpi-ghost material-symbols-rounded">${icon}</span></article>`;
}

function admin36UserFilterChanged() {
  admin35.userPage = 1;
  admin35FilterUsers();
}

function admin35FilterUsers() {
  const host = $('admin35UserRows');
  if (!host) return;
  const d = admin35.users,
    rows = admin36UserFiltered(),
    pageSize = Number(admin35.userPageSize || 8),
    pages = Math.max(1, Math.ceil(rows.length / pageSize));
  admin35.userPage = Math.min(Math.max(1, admin35.userPage), pages);
  const start = (admin35.userPage - 1) * pageSize,
    paged = rows.slice(start, start + pageSize);
  if (admin35.selectedUserId && !rows.some((x) => x.user_id === admin35.selectedUserId))
    admin35.selectedUserId = rows[0]?.user_id || null;
  if (!admin35.selectedUserId && rows[0]) admin35.selectedUserId = rows[0].user_id;
  host.innerHTML = `<div class="admin36-table-wrap"><table class="admin36-user-table"><thead><tr><th class="sel"></th><th>รหัสผู้ใช้</th><th>ชื่อ-สกุล</th><th>แผนก</th><th>บทบาท</th><th>สถานะ</th><th>เข้าสู่ระบบล่าสุด</th><th class="actions">จัดการ</th></tr></thead><tbody>${paged.length ? paged.map((u) => admin36UserRow(u)).join('') : `<tr><td colspan="8" class="admin35-empty">ไม่พบผู้ใช้</td></tr>`}</tbody></table></div>${admin36UserPager(rows.length, pageSize, pages, start, paged.length)}`;

function admin36UserPager(total, size, pages, start, count) {
  const nums = [];
  for (let i = 1; i <= pages; i++) {
    if (pages <= 7 || i === 1 || i === pages || Math.abs(i - admin35.userPage) <= 2) nums.push(i);
  }
  let last = 0,
    buttons = '';
  nums.forEach((i) => {
    if (last && i - last > 1) buttons += '<span class="ellipsis">…</span>';
    buttons += `<button class="${i === admin35.userPage ? 'active' : ''}" onclick="admin36UserGo(${i})">${i}</button>`;
    last = i;
  });
  return `<div class="admin36-pager"><span>แสดง ${total ? start + 1 : 0} - ${start + count} จาก ${total} รายการ</span><div class="admin36-pages"><button onclick="admin36UserGo(${Math.max(1, admin35.userPage - 1)})"><span class="material-symbols-rounded">chevron_left</span></button>${buttons}<button onclick="admin36UserGo(${Math.min(pages, admin35.userPage + 1)})"><span class="material-symbols-rounded">chevron_right</span></button></div><select onchange="admin35.userPageSize=Number(this.value);admin35.userPage=1;admin35FilterUsers()"><option value="8" ${size === 8 ? 'selected' : ''}>แสดง 8 รายการ</option><option value="16" ${size === 16 ? 'selected' : ''}>แสดง 16 รายการ</option><option value="24" ${size === 24 ? 'selected' : ''}>แสดง 24 รายการ</option></select></div>`;
}

function admin36PermissionState(role, row) {
  const p = ((admin35.permDraft && admin35.permDraft[role]) || {})[row.code] || {};
  if (!p.view) return 'none';
  return p.create || p.edit || p.delete || p.export || p.manage ? 'full' : 'limited';
}

function admin36PermissionIcon(state) {
  return state === 'full'
    ? '<span class="admin36-perm-state full material-symbols-rounded">check</span>'
    : state === 'limited'
      ? '<span class="admin36-perm-state limited material-symbols-rounded">remove</span>'
      : '<span class="admin36-perm-state none material-symbols-rounded">lock</span>';
}

function admin36SortRoles(roles) {
  const order = new Map(
    ['ADMIN', 'MANAGER', 'TECHNICIAN', 'ITSUPPORT', 'USER'].map((code, index) => [code, index]),
  );
  return roles.slice().sort((a, b) => {
    const aCode = String(a.code || '').trim().toUpperCase();
    const bCode = String(b.code || '').trim().toUpperCase();
    const aRank = order.has(aCode) ? order.get(aCode) : Number.MAX_SAFE_INTEGER;
    const bRank = order.has(bCode) ? order.get(bCode) : Number.MAX_SAFE_INTEGER;
    return aRank - bRank || Number(a.sort_order || 0) - Number(b.sort_order || 0) || aCode.localeCompare(bCode);
  });
}

  const d = admin35.permissions,

    rows = admin36PermissionRows(),

  $('content').innerHTML =
    `<section class="admin35 admin36-permissions">${admin35Header('group', 'กำหนดสิทธิ์', 'จัดการสิทธิ์การเข้าใช้งานระบบตามบทบาท (Role Based Access Control)')}

function admin35SelectRole(role) {
  admin35.role = role;
  admin35PermissionsRender();
}

function admin36CyclePermission(roleCode, moduleCode) {
  if (!admin35.permissions || !admin35.permissions.can_manage) return;
  const role = (admin35.permissions.roles || []).find((x) => x.code === roleCode);
  if (!role) return;
  const draft = (admin35.permDraft[roleCode] ||= {});
  const p = draft[moduleCode] || admin55DraftState('none');
  const state = !p.view
    ? 'none'
    : p.create || p.edit || p.delete || p.export || p.manage
      ? 'full'
      : 'limited';
  const next = state === 'full' ? 'limited' : state === 'limited' ? 'none' : 'full';
  // ADMIN recovery rights must remain usable. Show an explicit message instead of fake success.
  if (roleCode === 'ADMIN' && moduleCode === 'PERMISSION_MANAGEMENT' && next !== 'full') {
    toast('สิทธิ์กำหนดสิทธิ์ของ ADMIN ต้องเป็น ✅ เพื่อกู้คืนระบบ');
    return;
  }
  draft[moduleCode] = admin55DraftState(next);
  admin35PermissionsRender();
}

async function admin35SavePermissions() {
  const d = admin35.permissions;
  if (!d || !d.can_manage) return toast('ไม่มีสิทธิ์บันทึก Permission Matrix');
  const changes = admin56Changes();
  if (!Object.keys(changes).length) return toast('ไม่มีสิทธิ์ที่เปลี่ยนแปลง');
  loading(true);
  try {
    const result = await call('saveAdminPermissionChanges', token, changes);
    if (!result || result.saved !== true) throw Error('Server ไม่ยืนยันการบันทึกสิทธิ์');
    const fresh = await call('getAdminPermissions', token);
    for (const [role, modules] of Object.entries(changes)) {
      for (const [mod, wanted] of Object.entries(modules)) {
        const got = ((fresh.matrix || {})[role] || {})[mod];
        if (!got || Object.keys(wanted).some((key) => Boolean(got[key]) !== wanted[key]))
          throw Error('ค่าที่อ่านกลับไม่ตรงกับที่บันทึก: ' + role + '/' + mod);
      }
    }
    admin35.permissions = fresh;
    admin35.permOriginal = JSON.parse(JSON.stringify(fresh.matrix || {}));
    admin35.permDraft = JSON.parse(JSON.stringify(fresh.matrix || {}));
    await refresh();
    toast('บันทึกและตรวจสอบสิทธิ์จากฐานข้อมูลแล้ว ' + result.module_count + ' ช่อง');
  } catch (e) {
    fail(e);
  } finally {
    loading(false);
  }
}

function admin36CopyPermissions() {
  const roles = (admin35.permissions.roles || []).filter((x) => x.code !== admin35.role);
  if (!roles.length) return;
  openModal(
    'คัดลอกสิทธิ์จากบทบาท',
    `<form onsubmit="event.preventDefault();const src=uiValue('a36CopyRole');admin35.permDraft[admin35.role]=JSON.parse(JSON.stringify(admin35.permDraft[src]||{}));closeModal();admin35PermissionsRender();"><label>บทบาทต้นทาง<select id="a36CopyRole">${roles.map((r) => `<option value="${escAttr(r.code)}">${esc(r.code)} - ${esc(r.name)}</option>`).join('')}</select></label><p class="admin35-form-note">คัดลอกสิทธิ์ทั้ง 11 เมนู กดบันทึกเพื่อยืนยัน</p><div class="admin35-form-actions"><button type="button" class="outline" onclick="closeModal()">ยกเลิก</button><button class="primary">คัดลอกสิทธิ์</button></div></form>`,
  );
}

function admin35ExportAudit() {

function admin39BrowserLabel() {
  const ua = navigator.userAgent || '';
  const os = /Windows/i.test(ua)
    ? 'Windows'
    : /Macintosh|Mac OS/i.test(ua)
      ? 'macOS'
      : /Android/i.test(ua)
        ? 'Android'
        : /iPhone|iPad/i.test(ua)
          ? 'iOS'
          : 'Web';
  const browser = /Edg\//.test(ua)
    ? 'Edge'
    : /Chrome\//.test(ua)
      ? 'Chrome'
      : /Firefox\//.test(ua)
        ? 'Firefox'
        : /Safari\//.test(ua)
          ? 'Safari'
          : 'Browser';
  return `${os} / ${browser}`;
}

async function admin35SaveSettings() {
  loading(true);
  try {
    const payload = {
      project_name: uiValue('a35ProjectName', true),
      service_folder_id: uiValue('a35ServiceFolder', true),
      backup_folder_id: uiValue('a44BackupFolder', true),
      documents_folder_id: uiValue('a44DocumentsFolder', true),
      pictures_folder_id: uiValue('a44PicturesFolder', true),
      system_assets_folder_id: uiValue('a44SystemAssetsFolder', true),
      system_short_name: uiValue('a39ShortName', true),
      system_description: uiValue('a39Description', true),
    };
    await call('saveAdminSettings', token, payload);
    if (state) {
      state.settings = Object.assign({}, state.settings || {}, payload);
      state.branding = normalizeSystemBranding(payload);
      applySystemBranding(state.branding);
    }
    admin35.settings = await call('getAdminSettings', token);
    if (state) state.settings = Object.assign({}, state.settings || {}, admin35.settings);
    setTheme();
    admin35SettingsRender();
    toast('บันทึกการตั้งค่าแล้ว');
  } catch (e) {
    fail(e);
  } finally {
    loading(false);
  }
}

// apps/webapp/src/client/features/branding/icon-controller.js
function admin35PreviewIcon(input) {
  const file = input && input.files && input.files[0];
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!['png', 'jpg'].includes(ext) || !['image/png', 'image/jpeg'].includes(file.type)) {
    input.value = '';
    toast('รองรับเฉพาะไฟล์ PNG หรือ JPG เท่านั้น');
    return;
  }
  const url = URL.createObjectURL(file),
    img = new Image();
  img.onload = () => {
    if (img.naturalWidth !== img.naturalHeight) {
      URL.revokeObjectURL(url);
      input.value = '';
      toast('ไอคอนต้องเป็นรูปสี่เหลี่ยมจัตุรัส (1:1)');
      return;
    }
    if (img.naturalWidth < 250) {
      URL.revokeObjectURL(url);
      input.value = '';
      toast('ไอคอนต้องมีขนาดอย่างน้อย 250 x 250 px');
      return;
    }
    const host = $('admin35IconPreview');
    if (host) host.innerHTML = `<img src="${url}" alt="ตัวอย่างไอคอน">`;
  };
  img.onerror = () => {
    URL.revokeObjectURL(url);
    input.value = '';
    toast('ไม่สามารถอ่านไฟล์รูปภาพได้');
  };
  img.src = url;
}

async function admin35UploadIcon() {
  const file = uiFile('admin35IconFile');
  if (!file) {
    toast('กรุณาเลือกไฟล์ไอคอน');
    return;
  }
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!['png', 'jpg'].includes(ext) || !['image/png', 'image/jpeg'].includes(file.type)) {
    toast('รองรับเฉพาะไฟล์ PNG หรือ JPG เท่านั้น');
    return;
  }
  loading(true);
  try {
    const base64 = await admin35EncodeIcon(file),
      uploadName = file.name.replace(/\.[^.]+$/, '') + '.png',
      result = await call('uploadSystemIcon', token, uploadName, 'image/png', base64);
    admin35.icon = `data:${result.mime};base64,${result.base64}`;
    admin35.iconLoadedId = result.file_id;
    admin35ApplySystemIcon(admin35.icon);
    admin35.settings = await call('getAdminSettings', token);
    admin35SettingsRender();
    toast('อัปโหลดไอคอนระบบแล้ว');
  } catch (e) {
    fail(e);
  } finally {
    loading(false);
  }
}

// Decode the actual image before upload: downloaded images may have a JPG
// filename while containing WebP bytes. Canvas emits a real PNG for the server.
function admin35EncodeIcon(file) {
  return new Promise((resolve, reject) => {
    if (file.size > 10 * 1024 * 1024) {
      reject(Error('ไฟล์รูปภาพมีขนาดใหญ่เกินไป'));
      return;
    }
    const url = URL.createObjectURL(file), img = new Image();
    const fail = (message) => {
      URL.revokeObjectURL(url);
      reject(Error(message));
    };
    img.onerror = () => fail('ไม่สามารถอ่านไฟล์รูปภาพได้');
    img.onload = () => {
      try {
        const width = img.naturalWidth, height = img.naturalHeight;
        if (width !== height) return fail('ไอคอนต้องเป็นรูปสี่เหลี่ยมจัตุรัส (1:1)');
        if (width < 250) return fail('ไอคอนต้องมีขนาดอย่างน้อย 250 x 250 px');
        const canvas = document.createElement('canvas');
        // Branding icons need at most 1024px; bound memory and upload size.
        canvas.width = canvas.height = Math.min(width, 1024);
        const context = canvas.getContext('2d');
        if (!context) return fail('ไม่สามารถประมวลผลรูปภาพได้');
        context.drawImage(img, 0, 0, canvas.width, canvas.height);
        const data = canvas.toDataURL('image/png');
        if (!data.startsWith('data:image/png;base64,')) return fail('ไม่สามารถประมวลผลรูปภาพได้');
        const base64 = data.split(',')[1];
        if (base64.length > Math.ceil(10 * 1024 * 1024 / 3) * 4)
          return fail('ไฟล์รูปภาพมีขนาดใหญ่เกินไป');
        URL.revokeObjectURL(url);
        resolve(base64);
      } catch (_) {
        fail('ไม่สามารถประมวลผลรูปภาพได้');
      }
    };
    img.src = url;
  });
}

function admin35ApplySystemIcon(dataUrl) {
  document.querySelectorAll('.logo').forEach((el) => {
    el.classList.toggle('admin35-has-icon', Boolean(dataUrl));
    if (dataUrl)
      el.innerHTML = `<img src="${dataUrl}" alt="${escAttr(currentSystemBranding().project_name)}">`;
    else
      el.innerHTML =
        '<span class="material-symbols-rounded" aria-hidden="true">account_circle</span>';
  });
  const progress = document.querySelector('.login-progress-logo');
  if (progress) {
    progress.classList.toggle('admin35-has-icon', Boolean(dataUrl));
    if (dataUrl) {
      progress.classList.remove('material-symbols-rounded');
      progress.innerHTML = `<img src="${dataUrl}" alt="${escAttr(currentSystemBranding().project_name)}">`;
    } else {
      progress.classList.add('material-symbols-rounded');
      progress.textContent = 'account_circle';
    }
  }
  let fav = document.querySelector('link[data-admin35-favicon]');
  if (dataUrl) {
    if (!fav) {
      fav = document.createElement('link');
      fav.rel = 'icon';
      fav.setAttribute('data-admin35-favicon', '1');
      document.head.appendChild(fav);
    }
    fav.href = dataUrl;
  } else if (fav) fav.remove();
}

async function admin35SyncSystemIcon() {
  if (admin35PublicIconPromise) await admin35PublicIconPromise;
  if (!state) return;
  const id = (state.settings && state.settings.system_icon_file_id) || '';
  if (!id) {
    admin35.iconLoadedId = '';
    admin35.icon = null;
    admin35ApplySystemIcon(null);
    return;
  }
  if (admin35.iconLoadedId === id && admin35.icon) {
    admin35ApplySystemIcon(admin35.icon);
    return;
  }
  try {
    const data = await call('getSystemIconData', token);
    if (!data || !data.base64) return;
    admin35.icon = `data:${data.mime};base64,${data.base64}`;
    admin35.iconLoadedId = data.file_id;
    admin35ApplySystemIcon(admin35.icon);
    if (page === 'settings' && admin35.settings) admin35SettingsRender();
  } catch (e) {
    console.warn('[OCPB ICON]', e);
  }
}

function admin35LoadPublicSystemIcon() {
  if (!admin35PublicIconPromise)
    admin35PublicIconPromise = (async function () {
      try {
        const data = await call('getPublicSystemIconData');
        if (!data || !data.base64) return;
        if (
          state &&
          String((state.settings || {}).system_icon_file_id || '') !== String(data.file_id || '')
        )
          return;
        admin35.icon = `data:${data.mime};base64,${data.base64}`;
        admin35.iconLoadedId = data.file_id || '';
        admin35ApplySystemIcon(admin35.icon);
      } catch (e) {
        console.warn('[OCPB PUBLIC ICON]', e);
      }
    })();
  return admin35PublicIconPromise;
}

// apps/webapp/src/client/features/pm/calendar-controller.js
function pmMonthNow() {
  return bkkDate().slice(0, 7);
}

function pmShiftMonth(delta) {
  const [y, m] = PM_UI.month.split('-').map(Number),
    d = new Date(Date.UTC(y, m - 1 + delta, 1));
  pmSetPeriod(d.getUTCMonth() + 1, d.getUTCFullYear());
}

function pmSetPeriod(month, year) {
  const m = Number(month), y = Number(year);
  if (!Number.isInteger(m) || m < 1 || m > 12 || !Number.isInteger(y) || y < 2000 || y > 2200) return;
  PM_UI.month = `${y}-${String(m).padStart(2, '0')}`;
  pmCalendarPage();
}

function pmCurrentPeriod() { PM_UI.month = pmMonthNow(); pmCalendarPage(); }

function pmMonthControls() {
  const [year, month] = (PM_UI.month || pmMonthNow()).split('-').map(Number);
  const months = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
  const firstYear = Math.max(2000, year - 10), lastYear = Math.min(2200, year + 10);
  return `<div class="pm78-period" role="group" aria-label="เลือกเดือนและปีปฏิทิน PM">
    <button type="button" class="outline pm78-arrow" onclick="pmShiftMonth(-1)" title="เดือนก่อนหน้า" aria-label="เดือนก่อนหน้า" ${year === 2000 && month === 1 ? 'disabled' : ''}><span class="material-symbols-rounded" aria-hidden="true">chevron_left</span></button>
    <label class="pm78-month"><span class="pm78-label">เดือน</span><select id="pm78Month" aria-label="เลือกเดือน" onchange="pmSetPeriod(this.value,document.getElementById('pm78Year').value)">${months.map((name,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${name}</option>`).join('')}</select></label>
    <button type="button" class="outline pm78-arrow" onclick="pmShiftMonth(1)" title="เดือนถัดไป" aria-label="เดือนถัดไป" ${year === 2200 && month === 12 ? 'disabled' : ''}><span class="material-symbols-rounded" aria-hidden="true">chevron_right</span></button>
    <label class="pm78-year"><span class="pm78-label">ปี พ.ศ.</span><select id="pm78Year" aria-label="เลือกปี พ.ศ." onchange="pmSetPeriod(document.getElementById('pm78Month').value,this.value)">${Array.from({length:lastYear-firstYear+1},(_,i)=>firstYear+i).map(y=>`<option value="${y}" ${y===year?'selected':''}>${y+543}</option>`).join('')}</select></label>
    <button type="button" class="outline pm78-today" onclick="pmCurrentPeriod()">เดือนปัจจุบัน</button>
  </div>`;
}

function pmCanManage() {
  return state && ['ADMIN', 'MANAGER'].includes(String(state.user.role).toUpperCase());
}

function pmCalendarPage() {
  if (!PM_UI.month) PM_UI.month = pmMonthNow();
  $('content').innerHTML =
    `<section class="pm-layout"><div class="pm-top"><div><h1>จัดการแผน PM</h1><p>ปฏิทินบำรุงรักษาอุปกรณ์ · เลือกวันเพื่อสร้างแผน หรือลากรายการเพื่อเปลี่ยนวัน</p></div><div class="pm-actions">${pmMonthControls()}${pmCanManage() ? '<button class="primary" onclick="pmForm()">+ สร้างแผน PM</button>' : ''}</div></div><div id="pmStatus" aria-live="polite">กำลังโหลดแผน...</div><div id="pmGrid" class="pm-calendar"></div><div class="pm-help">สีน้ำเงิน: รอดำเนินการ · สีส้ม: กำลังดำเนินการ · สีเขียว: เสร็จแล้ว · สีเทา: ยกเลิก</div><div class="pm122-legend"><span><i class="pm122-holiday"></i>วันหยุดราชการ / วันหยุดพิเศษ</span><span><i class="pm122-weekend"></i>เสาร์–อาทิตย์</span><span>ประกาศทั่วไปแสดงข้อความในวันนั้น</span></div></section>`;
  pmLoad();
}

async function pmLoad() {
  const month = PM_UI.month;
  try {
    const v = await call('pmGetCalendar', token, month);
    if (page !== 'pm' || PM_UI.month !== month) return;
    PM_UI.items = v.items;
    PM_UI.orgs = v.orgs;
    document.getElementById('pmStatus').textContent =
      `${v.items.filter((x) => x.status !== 'ยกเลิก').length} รายการในเดือนนี้`;
    pmDraw();
  } catch (err) {
    const el = document.getElementById('pmStatus');
    if (el) el.textContent = err.message;
  }
}

function pmDraw() {
  const host = document.getElementById('pmGrid');
  if (!host) return;
  const [y, m] = PM_UI.month.split('-').map(Number),
    offset = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(),
    last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  let html = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์']
    .map((n) => `<div class="pm-week">${n}</div>`)
    .join('');
  for (let i = 0; i < Math.ceil((offset + last) / 7) * 7; i++) {
    const day = i - offset + 1,
      valid = day >= 1 && day <= last,
      key = `${PM_UI.month}-${String(day).padStart(2, '0')}`;
    if (!valid) {
      html += '<div class="pm-day pm-out"></div>';
      continue;
    }
    const cards = PM_UI.items.filter((v) => v.plan_date === key);
    html += `<div class="pm-day" data-pm-date="${key}" ondragover="event.preventDefault()" ondrop="pmDrop(event,'${key}')"><div class="pm-day-head"><b>${day}</b>${pmCanManage() ? `<button title="สร้างแผน" onclick="pmForm(null,'${key}')">+</button>` : ''}</div>${cards.map((v) => `<button type="button" class="pm-event pm-${['รอดำเนินการ', 'กำลังดำเนินการ', 'ดำเนินการแล้ว', 'ยกเลิก'].indexOf(v.status)}" draggable="${pmCanManage()}" ondragstart="pmDrag(event,'${v.plan_id}')" onclick="pmForm('${v.plan_id}')" title="${esc(v.description)}"><strong>${esc(v.org_name)}</strong><small>${esc(v.start_time)} · ${esc(v.work_area || v.status)}</small></button>`).join('')}</div>`;
  }
  host.innerHTML = html;
}

function pmDrag(event, id) {
  event.dataTransfer.setData('text/plain', id);
  event.dataTransfer.effectAllowed = 'move';
}

async function pmDrop(event, date) {
  event.preventDefault();
  if (!pmCanManage()) return;
  const id = event.dataTransfer.getData('text/plain'),
    p = PM_UI.items.find((x) => x.plan_id === id);
  if (!p || p.plan_date === date) return;
  if (!confirm(`ย้ายแผน ${p.org_name} ไปวันที่ ${date} ?`)) return;
  try {
    await call('pmMovePlan', token, id, date, Number(p.revision));
    await pmLoad();
    toast('ย้ายแผนสำเร็จ');
  } catch (e) {
    await pmLoad();
    fail(e);
  }
}

function pmForm(id = null, date = '') {
  if (!pmCanManage()) return toast('ไม่มีสิทธิ์แก้ไข');
  const p = PM_UI.items.find((x) => x.plan_id === id) || {};
  const opts = PM_UI.orgs
    .map(
      (x) =>
        `<option value="${esc(x.id)}" ${x.id === p.org_unit_id ? 'selected' : ''}>${esc(x.name)}</option>`,
    )
    .join('');
  openModal(
    id ? 'แก้ไขแผน PM' : 'สร้างแผน PM',
    `<form onsubmit="pmSubmit(event,'${esc(p.plan_id || '')}',${Number(p.revision || 0)})"><div class="form-grid"><label>วันที่ *<input id="pmDate" type="date" required value="${esc(p.plan_date || date || PM_UI.month + '-01')}"></label><label>หน่วยงาน *<select id="pmOrg" required><option value="">เลือกหน่วยงาน</option>${opts}</select></label><label>ส่วนงาน / ห้อง<input id="pmArea" maxlength="250" value="${esc(p.work_area || '')}"></label><label>เวลาเริ่ม<input id="pmStart" type="time" value="${esc(p.start_time || '10:00')}"></label><label>เวลาสิ้นสุด<input id="pmEnd" type="time" value="${esc(p.end_time || '16:00')}"></label><label>สถานะ<select id="pmState">${['รอดำเนินการ', 'กำลังดำเนินการ', 'ดำเนินการแล้ว', 'ยกเลิก'].map((s) => `<option ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label></div><label>รายละเอียดงาน *<textarea id="pmDescription" rows="4" maxlength="2000" required>${esc(p.description || '')}</textarea></label><div class="form-actions">${id ? `<button type="button" class="outline pm-delete" onclick="pmRequestSoftDelete('${esc(id)}',${Number(p.revision)})">ลบแผน</button>` : ''}${id ? `<button type="button" class="outline" onclick="pmCancel('${esc(id)}',${Number(p.revision)})">ยกเลิกแผน</button>` : ''}<button class="primary" type="submit">บันทึก</button></div></form>`,
  );
}

async function pmSubmit(event, id, revision) {
  event.preventDefault();
  const payload = {
    plan_id: id,
    revision,
    plan_date: document.getElementById('pmDate').value,
    org_unit_id: document.getElementById('pmOrg').value,
    work_area: document.getElementById('pmArea').value,
    start_time: document.getElementById('pmStart').value,
    end_time: document.getElementById('pmEnd').value,
    status: document.getElementById('pmState').value,
    description: document.getElementById('pmDescription').value,
  };
  try {
    await call('pmSavePlan', token, payload);
    closeModal();
    PM_UI.month = payload.plan_date.slice(0, 7);
    pmCalendarPage();
    toast('บันทึกแผนสำเร็จ');
  } catch (e) {
    fail(e);
  }
}

async function pmCancel(id, revision) {
  if (!confirm('ยืนยันยกเลิกแผนนี้?')) return;
  try {
    await call('pmDeletePlan', token, id, revision);
    closeModal();
    pmCalendarPage();
    toast('ยกเลิกแผนแล้ว');
  } catch (e) {
    fail(e);
  }
}

async function pmRequestSoftDelete(id, revision) {
  if (!pmCanManage()) return toast('ไม่มีสิทธิ์ลบแผน');
  const p = PM_UI.items.find((x) => x.plan_id === id);
  if (!p) return fail(new Error('ไม่พบแผน กรุณาโหลดข้อมูลใหม่'));
  const question = `ยืนยันลบแผน PM?\nหน่วยงาน: ${p.org_name}\nวันที่: ${p.plan_date}\n\nรายการจะถูกซ่อนจากปฏิทิน แต่ยังเก็บประวัติไว้`;
  if (!confirm(question)) return;
  try {
    await call('pmSoftDeletePlan', token, id, Number(revision));
    closeModal();
    await pmLoad();
    toast('ลบแผนสำเร็จ (เก็บประวัติไว้)');
  } catch (e) {
    fail(e);
    await pmLoad();
  }
}

// apps/webapp/src/client/features/pm/planning-controller.js
function pmplOptions(values, value, key = 'id', label = 'name') {
  return values
    .map(
      (v) =>
        `<option value="${esc(v[key])}" ${String(v[key]) === String(value || '') ? 'selected' : ''}>${esc(v[label])}${v.active === false ? ' (ปิดใช้งาน)' : ''}</option>`,
    )
    .join('');
}

function pmplMonthQuery() {
  const month = PM_UI.month || pmMonthNow(),
    from = month + '-01';
  return {
    from,
    to: pmplShift(pmplShift(from, 32).slice(0, 7) + '-01', -1),
    planning_id: '',
    org_unit_id: '',
    owner_id: '',
    status: '',
  };
}

function pmplTabs() {
  return `<div class="pmpl-tabs" role="tablist" aria-label="มุมมองแผน PM"><button type="button" role="tab" aria-selected="${PM_UI.view !== 'planning'}" onclick="pmplView('calendar')">${pmplIcon('calendar_month')}ปฏิทิน</button><button type="button" role="tab" aria-selected="${PM_UI.view === 'planning'}" onclick="pmplView('planning')">${pmplIcon('view_timeline')}Planning</button></div>`;
}

function pmplView(view) {
  if (PMPL.editor && PMPL.busy) return toast('กำลังบันทึก Planning กรุณารอสักครู่');
  if (PMPL.editor && !confirm('ออกจากฟอร์มโดยไม่บันทึก?')) return;
  PMPL.editor = null;
  PM_UI.view = view;
  PMPL.epoch++;
  pmCalendarPage();
}

function pmplPage() {
  PMPL.query ??= pmplMonthQuery();
  PMPL.pack = null;
  PMPL.editor = null;
  PMPL.busy = false;
  $('content').innerHTML =
    `<section class="pmpl-page"><div class="pm-top"><div><h1>จัดการแผน PM</h1><p>วางแผนงาน ติดตามช่วงเวลา และตรวจความคืบหน้าของทีม</p></div><div class="pm-actions">${pmCanManage() ? `<button type="button" id="pmplCreate" class="primary" disabled onclick="pmplNew()">${pmplIcon('add')}สร้าง Planning</button>` : ''}<div class="pmpl-export"><label class="pmpl-sr" for="pmplExportFormat">รูปแบบส่งออก</label><select id="pmplExportFormat"><option value="pdf">PDF</option><option value="csv">CSV</option><option value="xlsx">XLSX</option></select><button type="button" class="outline" id="pmplExport" disabled onclick="pmplExport()">${pmplIcon('download')}ส่งออก</button></div></div></div>${pmplTabs()}<div id="pmplFilters"></div><div id="pmplNotice" role="status" aria-live="polite">กำลังโหลดแผน...</div><div id="pmplEditor"></div><div id="pmplResults"></div></section>`;
  pmplLoad();
}

function pmplFilterHtml(pack) {
  const q = PMPL.query;
  return `<form class="ui-panel pmpl-filters" id="pmplFilterForm" onsubmit="event.preventDefault();window.pmplApply()"><label>ตั้งแต่วันที่<input type="date" id="pmplFrom" required value="${q.from}"></label><label>ถึงวันที่<input type="date" id="pmplTo" required value="${q.to}"></label><label>ชุด Planning<select id="pmplGroup"><option value="">ทุกชุด / งาน PM เดิม</option>${pmplOptions(pack.groups, q.planning_id, 'planning_id', 'name')}</select></label><label>หน่วยงาน<select id="pmplOrg"><option value="">ทั้งหมด</option>${pmplOptions(pack.orgs, q.org_unit_id)}</select></label><label>ผู้รับผิดชอบ<select id="pmplOwner"><option value="">ทั้งหมด</option>${pmplOptions(pack.owners, q.owner_id)}</select></label><label>สถานะ<select id="pmplStatus"><option value="">ทั้งหมด</option>${PMPL_STATES.map((s) => `<option ${s === q.status ? 'selected' : ''}>${s}</option>`).join('')}</select></label><div class="pmpl-filter-actions"><button class="primary" id="pmplApply">${pmplIcon('filter_alt')}ประมวลผล</button>${pmCanManage() ? `<button type="button" class="outline" id="pmplEditGroup" ${q.planning_id && pack.ready ? '' : 'disabled'} onclick="pmplEdit()">แก้ไขชุดแผน</button>` : ''}</div></form>`;
}

function pmplInvalidate() {
  if (PMPL.pack) PMPL.pack.signature = '';
  $('pmplExport').disabled = true;
  $('pmplNotice').textContent = 'ตัวกรองเปลี่ยนแล้ว กดประมวลผลเพื่อแสดงข้อมูลล่าสุด';
}

function pmplApply() {
  if (PMPL.busy || PMPL.editor) return;
  PMPL.query = {
    from: uiValue('pmplFrom'),
    to: uiValue('pmplTo'),
    planning_id: uiValue('pmplGroup'),
    org_unit_id: uiValue('pmplOrg'),
    owner_id: uiValue('pmplOwner'),
    status: uiValue('pmplStatus'),
  };
  if (
    !PMPL.query.from ||
    !PMPL.query.to ||
    PMPL.query.to < PMPL.query.from ||
    pmplDays(PMPL.query.from, PMPL.query.to) > 365
  )
    return toast('เลือกช่วงวันไม่เกิน 366 วัน และวันสิ้นสุดต้องไม่น้อยกว่าวันเริ่ม');
  pmplLoad();
}

async function pmplLoad() {
  const epoch = ++PMPL.epoch,
    view = uiViewEpoch,
    query = { ...(PMPL.query || pmplMonthQuery()) };
  PMPL.busy = true;
  if ($('pmplExport')) $('pmplExport').disabled = true;
  if ($('pmplApply')) $('pmplApply').disabled = true;
  $('pmplFilterForm')
    ?.querySelectorAll('input,select')
    .forEach((n) => (n.disabled = true));
  if ($('pmplNotice')) $('pmplNotice').textContent = 'กำลังประมวลผลแผน...';
  try {
    const pack = await call('pmGetPlanning', token, query);
    if (epoch !== PMPL.epoch || page !== 'pm' || PM_UI.view !== 'planning' || view !== uiViewEpoch)
      return;
    PMPL.pack = pack;
    PMPL.query = pack.query;
    Object.assign(PM_UI, {
      items: pack.items,
      orgs: pack.orgs,
      owners: pack.owners,
      groups: pack.groups,
      ready: pack.ready,
    });
    $('pmplFilters').innerHTML =
      `<details class="pmpl-filter-disclosure" id="pmplFilterDisclosure" ${window.innerWidth > 700 ? 'open' : ''}><summary>ตัวกรองแผน · ${esc(pmplDate(pack.query.from))} – ${esc(pmplDate(pack.query.to))}</summary>${pmplFilterHtml(pack)}</details>`;
    $('pmplFilterForm').addEventListener('change', pmplInvalidate);
    $('pmplNotice').innerHTML = pack.ready
      ? `${pack.items.length} รายการ · ${esc(pmplDate(pack.query.from))} – ${esc(pmplDate(pack.query.to))}`
      : `Planning ยังไม่ได้เปิดใช้งาน แสดงรายการ PM เดิม${pack.can_setup ? ' <button type="button" class="outline" onclick="pmplSetup()">เปิดใช้งาน Planning</button>' : ' · ติดต่อ ADMIN เพื่อเปิดใช้งาน'}`;
    if ($('pmplCreate')) $('pmplCreate').disabled = !pack.ready;
    $('pmplExport').disabled = !pack.can_export || !pack.items.length;
    pmplResults();
  } catch (e) {
    if (epoch === PMPL.epoch && $('pmplNotice')) $('pmplNotice').textContent = e.message;
  } finally {
    if (epoch === PMPL.epoch) {
      PMPL.busy = false;
      if ($('pmplApply')) $('pmplApply').disabled = false;
      $('pmplFilterForm')
        ?.querySelectorAll('input,select')
        .forEach((n) => (n.disabled = false));
    }
  }
}

async function pmplSetup() {
  if (PMPL.busy || !confirm('เปิดใช้งาน Planning สำหรับระบบนี้? ข้อมูลแผน PM เดิมจะยังอยู่ครบ'))
    return;
  PMPL.busy = true;
  try {
    await call('pmSetupPlanning', token);
    await pmplLoad();
    toast('เปิดใช้งาน Planning แล้ว');
  } catch (e) {
    fail(e);
  } finally {
    PMPL.busy = false;
  }
}

function pmplResults() {
  const pack = PMPL.pack;
  if (!pack || !$('pmplResults')) return;
  const s = pack.summary;
  const figures = [
    ['งานทั้งหมด', s.total],
    ['เสร็จแล้ว', s.completed],
    ['กำลังทำ', s.in_progress],
    ['รอดำเนินการ', s.pending],
    ['เกินกำหนด', s.overdue],
  ];
  $('pmplResults').innerHTML =
    `<div class="pmpl-summary">${figures.map(([name, value]) => `<div><span>${name}</span><strong>${value}</strong></div>`).join('')}<div><span>งานเสร็จตามจำนวนรายการ</span><strong>${s.completion}%</strong><small>ไม่รวมงานยกเลิก</small></div></div><section class="ui-panel"><div class="pmpl-chart-head"><div><h2>แผนงานและช่วงเวลา</h2><p>เลือกชื่องานเพื่อดูรายละเอียด · แถบสีแสดงช่วงวันเริ่มถึงวันสิ้นสุด</p></div><label>ช่วงแกนเวลา<select id="pmplScale" onchange="PMPL.scale=this.value;pmplRenderTimeline()">${[
      ['day', 'วัน'],
      ['week', 'สัปดาห์'],
      ['month', 'เดือน'],
    ]
      .map(([v, n]) => `<option value="${v}" ${PMPL.scale === v ? 'selected' : ''}>${n}</option>`)
      .join(
        '',
      )}</select></label></div><div id="pmplTimeline"></div><div class="pmpl-legend">${PMPL_STATES.map((s, i) => `<span><i class="pmpl-tone-${i}"></i>${s}</span>`).join('')}</div></section>`;
  pmplRenderTimeline();
}

function pmplRenderTimeline() {
  const pack = PMPL.pack,
    host = $('pmplTimeline');
  if (!pack || !host) return;
  if (!pack.items.length) {
    host.innerHTML =
      '<div class="empty">ไม่พบงานในช่วงและตัวกรองที่เลือก เลือกช่วงอื่นหรือสร้าง Planning ใหม่</div>';
    return;
  }
  const axis = pmplAxis(
    pack.query.from,
    pack.query.to,
    PMPL.scale,
    Math.max(560, ($('content').clientWidth || 1000) - 330),
  );
  host.innerHTML = `<div class="pmpl-timeline-scroll" tabindex="0" aria-label="ตารางงานและ Gantt เลื่อนเพื่อดูช่วงเวลา"><table class="pmpl-gantt"><thead><tr><th class="pmpl-task-col">งาน / ผู้รับผิดชอบ</th><th><div class="pmpl-axis" style="width:${axis.width}px">${axis.ticks.map((t) => `<span style="left:${t.left}px">${esc(t.label)}</span>`).join('')}</div></th></tr></thead><tbody>${pack.items
    .map((p) => {
      const start = Math.max(0, pmplDays(pack.query.from, p.plan_date)),
        end = Math.min(axis.days, pmplDays(pack.query.from, p.end_date) + 1),
        left = start * axis.dayWidth,
        width = Math.max(3, (end - start) * axis.dayWidth),
        tone = PMPL_STATES.indexOf(p.status),
        overdue = p.end_date < pack.today && !['ดำเนินการแล้ว', 'ยกเลิก'].includes(p.status);
      return `<tr><td class="pmpl-task-col"><button type="button" class="link pmpl-task-name" data-plan-id="${esc(p.plan_id)}" onclick="pmplTask(this.dataset.planId)" title="${esc(p.description)}">${esc(p.description)}</button><small>${esc(p.org_name)} · ${esc(p.owner_name || 'ยังไม่ระบุผู้รับผิดชอบ')}</small></td><td><div class="pmpl-track" style="width:${axis.width}px;--pmpl-day:${axis.dayWidth}px"><span class="pmpl-bar pmpl-tone-${tone}${overdue ? ' pmpl-overdue' : ''}" style="left:${left}px;width:${width}px" role="img" aria-label="${esc(p.description)} ${esc(p.plan_date)} ถึง ${esc(p.end_date)} ${esc(p.status)} ${p.progress}%" title="${esc(pmplDate(p.plan_date))} – ${esc(pmplDate(p.end_date))} · ${esc(p.status)} · ${p.progress}%"><i style="width:${p.progress}%"></i><b>${width > 55 ? p.progress + '%' : ''}</b></span></div></td></tr>`;
    })
    .join('')}</tbody></table></div>`;
}

function pmplCapture() {
  const e = PMPL.editor;
  if (!e) return;
  document.querySelectorAll('[data-group]').forEach((n) => (e[n.dataset.group] = n.value));
  document
    .querySelectorAll('[data-task]')
    .forEach((row) =>
      row
        .querySelectorAll('[data-field]')
        .forEach(
          (n) =>
            (e.tasks[Number(row.dataset.task)][n.dataset.field] =
              n.dataset.field === 'progress' ? Number(n.value) : n.value),
        ),
    );
}

function pmplUseExisting() {
  if (PMPL.busy) return;
  pmplCapture();
  const e = PMPL.editor,
    p = (e.available || []).find((p) => p.plan_id === uiValue('pmplExisting'));
  if (!p) return;
  if (e.tasks.length >= 100) return toast('รองรับสูงสุด 100 งาน');
  e.tasks.push({ ...p });
  pmplEditor();
}

// apps/webapp/src/client/features/pm/planning-timeline.js
function pmplAxis(from, to, scale, minWidth = 560) {
  const days = pmplDays(from, to) + 1,
    unit = scale === 'day' ? 36 : scale === 'month' ? 4 : 12,
    width = Math.max(minWidth, days * unit),
    dayWidth = width / days,
    ticks = [];
  for (let i = 0; i < days; i++) {
    const date = pmplShift(from, i),
      dt = new Date(date + 'T12:00:00Z');
    if (
      i === 0 ||
      scale === 'day' ||
      (scale === 'week' && dt.getUTCDay() === 1) ||
      (scale === 'month' && date.endsWith('-01'))
    ) {
      ticks.push({
        date,
        left: i * dayWidth,
        label:
          scale === 'month'
            ? new Intl.DateTimeFormat('th-TH', { month: 'short', year: '2-digit' }).format(dt)
            : new Intl.DateTimeFormat('th-TH', { day: 'numeric', month: 'short' }).format(dt),
      });
    }
  }
  return { days, width, dayWidth, ticks };
}

function pmplTask(id) {

  PM_UI.items = PMPL.pack.items;

function pmplDefaultTask() {
  return {
    plan_id: '',

function pmplNew() {
  if (!pmCanManage() || !PMPL.pack?.ready || PMPL.busy) return;
  PMPL.editor = {
    planning_id: 'PMG-' + crypto.randomUUID(),
    revision: 0,
    name: '',

    end_date: PMPL.query.to,
    tasks: [],
    removed: [],
    available: PMPL.pack.items.filter((p) => !p.planning_id),
  };
  PMPL.editor.tasks.push(pmplDefaultTask());
  pmplEditor();
}

async function pmplEdit() {
  if (PMPL.busy || !pmCanManage() || !PMPL.query.planning_id) return;
  PMPL.busy = true;
  const epoch = PMPL.epoch,
    view = uiViewEpoch;
  try {
    const d = await call('pmGetPlanningDetail', token, PMPL.query.planning_id);
    if (page !== 'pm' || PM_UI.view !== 'planning' || epoch !== PMPL.epoch || view !== uiViewEpoch)
      return;
    PMPL.editor = { ...d.group, tasks: d.items, removed: [], available: d.available || [] };
    PM_UI.orgs = d.orgs;
    PM_UI.owners = d.owners;
    pmplEditor();
  } catch (e) {
    fail(e);
  } finally {
    if (epoch === PMPL.epoch) PMPL.busy = false;
  }
}

function pmplProgressInput(status, input) {
  if (status.value === 'ดำเนินการแล้ว') input.value = 100;
  else if (status.value !== 'กำลังดำเนินการ' || Number(input.value) === 100) input.value = 0;
  input.readOnly = status.value !== 'กำลังดำเนินการ';
  input.max = status.value === 'กำลังดำเนินการ' ? '99' : '100';
}

function pmplAddTask() {
  if (PMPL.busy) return;
  pmplCapture();
  if (PMPL.editor.tasks.length >= 100) return toast('รองรับสูงสุด 100 งาน');
  PMPL.editor.tasks.push(pmplDefaultTask());
  pmplEditor();
}

function pmplMoveTask(i, step) {
  if (PMPL.busy) return;
  pmplCapture();
  const a = PMPL.editor.tasks;
  [a[i], a[i + step]] = [a[i + step], a[i]];
  pmplEditor();
}

function pmplRemoveTask(i) {
  if (PMPL.busy) return;
  pmplCapture();
  const p = PMPL.editor.tasks[i];
  if (p.plan_id && !confirm('ลบงานนี้จาก Planning และปฏิทิน PM โดยเก็บประวัติไว้?')) return;
  if (p.plan_id) PMPL.editor.removed.push({ plan_id: p.plan_id, revision: p.revision });
  PMPL.editor.tasks.splice(i, 1);
  pmplEditor();
}

function pmplCancelEditor() {
  if (PMPL.busy || !confirm('ออกจากฟอร์มโดยไม่บันทึก?')) return;
  PMPL.editor = null;
  $('pmplEditor').innerHTML = '';
  $('pmplFilters').hidden = false;
  $('pmplResults').hidden = false;
  pmplLoad();
}

async function pmplSave() {
  if (PMPL.busy || !PMPL.editor || !$('pmplEditorForm').reportValidity()) return;
  pmplCapture();
  const editor = structuredClone(PMPL.editor),
    view = uiViewEpoch;
  delete editor.available;
  if (editor.end_date < editor.start_date || pmplDays(editor.start_date, editor.end_date) > 365)
    return toast('กำหนดช่วง Planning ไม่เกิน 366 วัน');
  PMPL.busy = true;
  $('pmplEditorForm')
    .querySelectorAll('button')
    .forEach((b) => (b.disabled = true));
  try {
    const result = await call('pmSavePlanning', token, editor);
    if (page !== 'pm' || uiViewEpoch !== view || PM_UI.view !== 'planning') return;
    PMPL.editor = null;
    PMPL.query = {
      from: editor.start_date,
      to: editor.end_date,
      planning_id: result.id,
      org_unit_id: '',
      owner_id: '',
      status: '',
    };
    PM_UI.month = editor.start_date.slice(0, 7);
    pmplPage();
    toast('บันทึก Planning แล้ว');
  } catch (e) {
    fail(e);
  } finally {
    if (PMPL.editor) {
      PMPL.busy = false;
      if ($('pmplEditorForm'))
        $('pmplEditorForm')
          .querySelectorAll('button')
          .forEach((b) => (b.disabled = false));
    }
  }
}

function pmplExportSafe(value) {
  if (typeof value === 'number') return value;
  const text = String(value ?? '');
  return /^\s*[=+\-@\t\r]/.test(text) ? "'" + text : text;
}

function pmplExportCsv(pack) {
  const rows = [PMPL_EXPORT_HEADS, ...pmplExportRows(pack)];

  );

    .map(

    .map((p) => {
      const start = Math.max(0, pmplDays(from, p.plan_date)),

function pmplPrint(pack) {
  return new Promise((resolve, reject) => {
    $('pmplPrintFrame')?.remove();
    const frame = document.createElement('iframe');
    frame.id = 'pmplPrintFrame';
    frame.title = 'PM Planning สำหรับพิมพ์';
    frame.setAttribute('aria-hidden', 'true');
    Object.assign(frame.style, {
      position: 'fixed',
      width: '0',
      height: '0',
      border: '0',
      opacity: '0',
    });
    document.body.appendChild(frame);
    let printed = false;
    const print = () => {
      if (printed) return;
      printed = true;
      try {
        frame.contentWindow.focus();
        frame.contentWindow.print();
        toast('เลือกบันทึกเป็น PDF ในหน้าพิมพ์');
        setTimeout(() => frame.remove(), 60000);
        resolve();
      } catch (e) {
        frame.remove();
        reject(e);
      }
    };
    const doc = frame.contentWindow.document;
    doc.open();
    doc.write(pmplPrintHtml(pack));
    doc.close();
    if (doc.fonts?.ready) doc.fonts.ready.then(print, print);
    setTimeout(print, 2500);
  });
}

async function pmplExport() {
  if (PMPL.exporting || PMPL.busy || PMPL.editor || !PMPL.pack?.signature || !PMPL.pack.can_export)
    return;
  const format = uiValue('pmplExportFormat'),
    packBefore = PMPL.pack,
    view = uiViewEpoch,
    epoch = PMPL.epoch,
    scale = PMPL.scale;
  PMPL.exporting = true;
  $('pmplExport').disabled = true;
  try {
    const pack = await call('pmGetPlanningExport', token, packBefore.query, packBefore.signature);
    if (
      page !== 'pm' ||
      view !== uiViewEpoch ||
      epoch !== PMPL.epoch ||
      PMPL.pack !== packBefore ||
      !PMPL.pack.signature
    )
      return;
    const filename = 'PM_Planning_' + pack.query.from + '_' + pack.query.to;
    if (format === 'csv')
      download(
        new Blob([pmplExportCsv(pack)], { type: 'text/csv;charset=utf-8' }),
        filename + '.csv',
      );
    else if (format === 'xlsx') {
      const XLSX = await cmLoadXlsx();
      if (view !== uiViewEpoch || PMPL.pack !== packBefore || !PMPL.pack.signature) return;
      const currentScale = PMPL.scale;
      PMPL.scale = scale;
      let bytes;
      try {
        bytes = XLSX.write(pmplWorkbook(pack, XLSX), { bookType: 'xlsx', type: 'array' });
      } finally {
        PMPL.scale = currentScale;
      }
      download(
        new Blob([bytes], {
          type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
        }),
        filename + '.xlsx',
      );
    } else await pmplPrint(pack);
    if (format !== 'pdf') toast('ส่งออก ' + format.toUpperCase() + ' แล้ว');
  } catch (e) {
    if (/ข้อมูลหรือตัวกรองเปลี่ยน/.test(e.message) && PMPL.pack === packBefore) {
      PMPL.pack.signature = '';
      if ($('pmplNotice'))
        $('pmplNotice').textContent = 'ข้อมูลเปลี่ยนแล้ว กดประมวลผลอีกครั้งก่อนส่งออก';
    }
    fail(e);
  } finally {
    PMPL.exporting = false;
    if ($('pmplExport'))
      $('pmplExport').disabled =
        PMPL.busy ||
        !!PMPL.editor ||
        !PMPL.pack?.signature ||
        !PMPL.pack.can_export ||
        !PMPL.pack.items.length;
  }
}

function project70Input(id, label, value = '', help = '', type = 'text') {
  return `<label>${label}<input id="${id}" type="${type}" value="${escAttr(value)}" ${type === 'password' ? 'autocomplete="new-password"' : 'autocomplete="off"'}><small>${help}</small></label>`;

function project70Message(id, text, error = false) {
  const node = $(id);
  if (node) {
    node.textContent = text;
    node.dataset.state = error ? 'error' : 'success';
  }
}

async function project70Task(button, action, messageId) {
  if (button?.disabled) return;
  const epoch = uiViewEpoch;
  if (button) button.disabled = true;
  try {
    await action();
  } catch (e) {
    if (epoch === uiViewEpoch) project70Message(messageId, e.message, true);
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

function project70SelectTab(which, focus = false) {
  if (!['general', 'line', 'project', 'holidays', 'report', 'password'].includes(which)) which = 'general';
  project70UI.tab = which;
  for (const [key, suffix] of [
    ['general', 'General'],
    ['line', 'Line'],
    ['project', 'Project'],
    ['holidays', 'Holidays'],
    ['report', 'Report'],
    ['password', 'Password'],
  ]) {
    const tab = $('itsdTab' + suffix),
      panel = $('itsdSettings' + suffix);
    if (tab) {
      tab.setAttribute('aria-selected', String(key === which));
      tab.tabIndex = key === which ? 0 : -1;
      if (key === which && focus) tab.focus();
    }
    if (panel) panel.hidden = key !== which;
  }
  if (which === 'password') nist118LoadPolicy();
  if (which === 'holidays') calendar122Load();
}

function nist118ForcePage() {

  $('nist118ChangeForm').onsubmit = async event => {
    event.preventDefault();
    const form = event.currentTarget, button = form.querySelector('button[type=submit]');

    if (Array.from(next).length < 15) { $('nist118ChangeError').textContent = 'รหัสผ่านใหม่ต้องมีอย่างน้อย 15 อักขระ'; return; }
    button.disabled = true;

      toast('เปลี่ยนรหัสผ่านสำเร็จ กรุณาเข้าสู่ระบบด้วยรหัสใหม่');

async function nist118LoadPolicy() {
  const host = $('project70PasswordMount');
  if (!host || host.dataset.loading === 'true' || state?.user?.role !== 'ADMIN') return;
  host.dataset.loading = 'true';
  try {
    const p = await call('getPasswordPolicy', token);
    if (!host.isConnected) return;
    host.innerHTML = `<section><h2>เปลี่ยนรหัสผ่าน NIST</h2><p>กำหนดรอบบังคับเปลี่ยนรหัสผ่านครั้งเดียวสำหรับทุกบทบาท รวม ADMIN ผู้ที่ยังไม่เข้าใช้งานจะถูกแจ้งเมื่อกลับมาเข้าสู่ระบบ</p><p class="hint">แนวทาง NIST: เปลี่ยนได้ทันที (ขั้นต่ำ 0 วัน) ไม่กำหนดอายุสูงสุดและไม่บังคับเปลี่ยนเป็นรายงวด รหัสผ่านใหม่อย่างน้อย 15 อักขระ รองรับสูงสุด 128 ตัวอักษร ตรวจรหัสที่คาดเดาง่ายและไม่ให้ซ้ำรหัสเดิม</p><form id="nist118PolicyForm"><div class="project70-grid"><label class="project70-full"><span>สถานะนโยบาย</span><select id="nist118Enabled"><option value="false" ${!p.enabled ? 'selected' : ''}>ปิดการบังคับรอบพิเศษ</option><option value="true" ${p.enabled ? 'selected' : ''}>เปิดการบังคับรอบพิเศษ</option></select></label><label>วันเวลาเริ่ม (เวลาประเทศไทย UTC+7)<input id="nist118Start" type="datetime-local" value="${escAttr(p.starts_at.slice(0,16))}" required></label><label>เริ่มรอบใหม่<select id="nist118NewRound"><option value="false">ใช้รอบเดิม — ผู้ที่เปลี่ยนแล้วไม่ถูกบังคับซ้ำ</option><option value="true">เริ่มรอบใหม่ — บังคับทุกบัญชีอีกครั้ง</option></select></label><label class="project70-full">ข้อความแจ้งเตือน<textarea id="nist118Message" rows="3" maxlength="500" required>${esc(p.message)}</textarea></label><label class="project70-full">ยืนยันรหัสผ่าน ADMIN ปัจจุบัน<input id="nist118AdminPassword" type="password" autocomplete="current-password" maxlength="128" required></label></div><p class="hint">หากเปิดโดยกำหนดเวลาเริ่มไว้ในอดีต จะมีผลทันที รวมถึงบัญชี ADMIN ที่บันทึกการตั้งค่า รหัสชั่วคราวจากการสร้างบัญชีหรือรีเซ็ตต้องเปลี่ยนก่อนใช้งาน</p><div class="project70-actions"><button type="submit" class="primary">บันทึกนโยบาย</button></div><p id="nist118PolicyResult" role="status"></p></form><p><a href="https://pages.nist.gov/800-63-4/sp800-63b.html" target="_blank" rel="noopener noreferrer">อ่านแนวทาง NIST SP 800-63B-4</a></p></section>`;
    $('nist118PolicyForm').onsubmit = async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector('button[type=submit]');
      if (button.disabled) return;
      button.disabled = true;
      try {
        await call('savePasswordPolicy', token, { revision: p.revision, enabled: $('nist118Enabled').value === 'true', starts_at: $('nist118Start').value, new_round: $('nist118NewRound').value === 'true', message: $('nist118Message').value, current_password: $('nist118AdminPassword').value });
        $('nist118AdminPassword').value = '';
        toast('บันทึกนโยบายแล้ว');
        await refresh();
      } catch (e) { if ($('nist118PolicyResult')) $('nist118PolicyResult').textContent = normalizeUiError(e); }
      finally { button.disabled = false; }
    };
  } catch (e) { if (host.isConnected) host.textContent = 'โหลดนโยบายไม่สำเร็จ: ' + normalizeUiError(e); }
  finally { host.dataset.loading = 'false'; }
}

const CALENDAR122_KINDS = {HOLIDAY:'วันหยุดราชการ',SPECIAL_HOLIDAY:'วันหยุดพิเศษ / ประกาศหยุด',ANNOUNCEMENT:'ประกาศ (ไม่ใช่วันหยุด)'};

  const host = $('project70HolidaysMount');

  host.textContent = 'กำลังโหลดวันหยุดและประกาศ...';

function calendar122Render(host, entries, entry = null) {
  const current = entry || {id:'',revision:0,title:'',kind:'HOLIDAY',start_date:bkkDate().slice(0,10),end_date:bkkDate().slice(0,10),notes:'',active:true};
  host.innerHTML = `<section class="calendar122-settings"><h2>จัดการวันหยุด</h2><p>ADMIN เพิ่มวันหยุดราชการ วันหยุดพิเศษ และประกาศสำหรับปฏิทิน PM โดยระบุวันที่ตามประกาศจริง</p><p class="hint">พื้นหลังแดงอ่อน: วันหยุดราชการ / วันหยุดพิเศษ · พื้นหลังเทา: เสาร์–อาทิตย์ · ประกาศทั่วไปแสดงข้อความโดยไม่เปลี่ยนวันทำการ ไม่มีการเพิ่มวันหยุดราชการให้อัตโนมัติ</p><form id="calendar122Form"><h3>${current.id ? 'แก้ไขรายการ' : 'เพิ่มวันหยุด / ประกาศ'}</h3><div class="project70-grid"><label>ประเภท<select id="calendar122Kind">${Object.entries(CALENDAR122_KINDS).map(([key,label]) => `<option value="${key}" ${current.kind === key ? 'selected' : ''}>${label}</option>`).join('')}</select></label><label>ชื่อวันหยุด / ประกาศ<input id="calendar122Title" required maxlength="160" value="${escAttr(current.title)}"></label><label>ตั้งแต่วันที่<input id="calendar122Start" type="date" required value="${escAttr(current.start_date)}"></label><label>ถึงวันที่<input id="calendar122End" type="date" required value="${escAttr(current.end_date)}" min="${escAttr(current.start_date)}"></label><label class="project70-full">รายละเอียด / อ้างอิงประกาศ<textarea id="calendar122Notes" rows="3" maxlength="2000">${esc(current.notes || '')}</textarea></label><label class="calendar122-active"><input id="calendar122Active" type="checkbox" ${current.active ? 'checked' : ''}>เปิดใช้งานในปฏิทิน</label></div><div class="project70-actions"><button class="primary" type="submit">บันทึกรายการ</button>${current.id ? '<button class="outline" type="button" id="calendar122Cancel">ยกเลิกแก้ไข</button>' : ''}</div><p id="calendar122Message" role="status"></p></form><h3>วันหยุดและประกาศ (${entries.length} รายการ)</h3><div class="calendar122-table-wrap"><table class="table"><thead><tr><th>ช่วงวันที่</th><th>ประเภท</th><th>ชื่อ / รายละเอียด</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${entries.length ? entries.map(x => `<tr><td>${esc(x.start_date)}${x.end_date !== x.start_date ? '<br>ถึง ' + esc(x.end_date) : ''}</td><td>${esc(CALENDAR122_KINDS[x.kind] || x.kind)}</td><td><b>${esc(x.title)}</b><small>${esc(x.notes || '')}</small></td><td>${x.active ? 'เปิดใช้งาน' : 'ปิดใช้งาน'}</td><td><div class="calendar122-actions"><button type="button" class="outline" data-calendar-edit="${escAttr(x.id)}">แก้ไข</button><button type="button" class="danger" data-calendar-delete="${escAttr(x.id)}">ลบ</button></div></td></tr>`).join('') : '<tr><td colspan="5">ยังไม่มีวันหยุดหรือประกาศที่ตั้งค่าไว้ เสาร์–อาทิตย์แสดงสีเทาอัตโนมัติ</td></tr>'}</tbody></table></div></section>`;
  const input = name => host.querySelector('#calendar122' + name);
  input('Start').onchange = () => { input('End').min=input('Start').value; if (input('End').value < input('Start').value) input('End').value=input('Start').value; };
  if (input('Cancel')) input('Cancel').onclick = () => calendar122Render(host, entries);
  let busy = false;
  async function run(action) {
    if (busy) return;
    busy=true; const buttons=Array.from(host.querySelectorAll('button')); buttons.forEach(b => b.disabled=true);
    input('Message').textContent='กำลังบันทึก...';
    try { await action(); if (host.isConnected) { toast('บันทึกวันหยุด / ประกาศแล้ว'); await calendar122Load(); } }
    catch(e) { if (host.isConnected && input('Message')) input('Message').textContent=normalizeUiError(e); }
    finally { busy=false; buttons.forEach(b => b.disabled=false); }
  }
  input('Form').onsubmit = event => {
    event.preventDefault();
    if (!event.currentTarget.reportValidity()) return;
    const data={id:current.id,revision:current.revision,kind:input('Kind').value,title:input('Title').value,start_date:input('Start').value,end_date:input('End').value,notes:input('Notes').value,active:input('Active').checked};
    run(() => call('saveCalendarEntry', token, data));
  };
  host.querySelectorAll('[data-calendar-edit]').forEach(button => button.onclick=() => { const selected=entries.find(x=>x.id===button.dataset.calendarEdit); if (selected) { calendar122Render(host,entries,selected); $('calendar122Title').focus(); } });
  host.querySelectorAll('[data-calendar-delete]').forEach(button => button.onclick=() => { const selected=entries.find(x=>x.id===button.dataset.calendarDelete); if (selected && confirm('ลบรายการ “' + selected.title + '” ออกจากปฏิทิน? ประวัติการแก้ไขยังคงเก็บไว้')) run(() => call('deleteCalendarEntry',token,selected.id,selected.revision)); });
}

function service70Date(value) {
  const s = String(value || '');

}

async function service70Print(id, button) {
  if (button?.disabled) return;
  if (button) button.disabled = true;
  let frame;
  try {
    const data = await call('getServiceReport', token, id);
    document.getElementById('service70PrintFrame')?.remove();
    frame = document.createElement('iframe');
    frame.id = 'service70PrintFrame';
    frame.title = 'ใบงานบริการสำหรับพิมพ์';
    Object.assign(frame.style, {
      position: 'fixed',
      width: '1px',
      height: '1px',
      right: '0',
      bottom: '0',
      border: '0',
      opacity: '0',
      pointerEvents: 'none',
    });
    document.body.appendChild(frame);
    const logo = (typeof admin35 !== 'undefined' && admin35.icon) || '';
    const doc = frame.contentDocument;
    doc.open();
    doc.write(service70Html(data, logo));
    doc.close();
    await Promise.race([
      doc.fonts?.ready || Promise.resolve(),
      new Promise((resolve) => setTimeout(resolve, 4000)),
    ]);
    await Promise.all(
      Array.from(doc.images).map((img) =>
        img.complete
          ? Promise.resolve()
          : new Promise((resolve) => {
              img.onload = img.onerror = resolve;
              setTimeout(resolve, 2000);
            }),
      ),
    );
    frame.contentWindow.addEventListener(
      'afterprint',
      () => setTimeout(() => frame.remove(), 1000),
      { once: true },
    );
    frame.contentWindow.focus();
    frame.contentWindow.print();
    toast('เลือกบันทึกเป็น PDF หรือเครื่องพิมพ์ในหน้าพิมพ์');
    setTimeout(() => frame.remove(), 120000);
  } catch (e) {
    frame?.remove();
    fail(e);
  } finally {
    if (button?.isConnected) button.disabled = false;
  }
}

    );

        button = form.querySelector('[type=submit]');

      } catch (e) {
        fail(e);
      } finally {
        if (button.isConnected) button.disabled = false;
      }

    if (!value) return '';
    if (typeof value === 'string') {
      const text = value.trim();
      if (text.length >= 20 && text.length <= 2048) return text;
      try {
        return readTokenCandidate(JSON.parse(text));
      } catch (_) {
        return '';
      }
    }
    if (typeof value === 'object') {
      const keys = [
        'sessionToken',
        'session_token',
        'token',
        'authToken',
        'accessToken',
        'access_token',
      ];
      for (const key of keys) {
        if (typeof value[key] === 'string' && value[key].trim().length >= 20) {
          return value[key].trim();
        }
      }
      if (value.session) {
        const nested = readTokenCandidate(value.session);
        if (nested) return nested;
      }
    }
    return '';
